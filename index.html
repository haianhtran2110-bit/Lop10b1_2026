<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sổ quản lý lớp 10B1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F3E8;
    --paper-line:rgba(31,42,68,0.10);
    --ink:#1F2A44;
    --ink-soft:#5B6580;
    --ok:#3A7D44;
    --warn:#A9791F;
    --bad:#B23A2E;
    --info:#5B6580;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Be Vietnam Pro',system-ui,sans-serif;
    color:var(--ink);
    background:
      repeating-linear-gradient(var(--paper), var(--paper) 27px, var(--paper-line) 28px),
      var(--paper);
    min-height:100vh;
  }
  .app{max-width:520px;margin:0 auto;padding-bottom:84px;}
  .cover{padding:22px 18px 16px;color:#fff;transition:background .25s ease;}
  .cover .role-label{font-size:12px;letter-spacing:.02em;opacity:.85;margin:0 0 2px;}
  .cover h1{margin:0;font-size:22px;font-weight:800;}
  .cover .sub{margin:4px 0 0;font-size:13px;opacity:.9;}
  .datebar{
    display:flex;align-items:center;gap:8px;
    padding:10px 18px;background:rgba(255,255,255,0.55);
    border-bottom:1px solid var(--paper-line);
    position:sticky;top:0;backdrop-filter:blur(4px);z-index:5;
  }
  .datebar input[type=date]{
    font-family:inherit;font-size:14px;border:1px solid var(--paper-line);
    background:#fff;border-radius:8px;padding:6px 8px;color:var(--ink);
  }
  .datebar .today-btn{
    font-size:12px;background:#fff;border:1px solid var(--paper-line);
    border-radius:8px;padding:6px 10px;color:var(--ink-soft);
  }
  main{padding:14px 16px 6px;}
  h2.section{font-size:15px;font-weight:700;margin:18px 0 8px;color:var(--ink);}
  h2.section input[type=month]{font-size:13px;border:1px solid var(--paper-line);border-radius:6px;padding:4px 6px;font-family:inherit;margin-left:6px;}
  .card{background:#fff;border-radius:10px;border:1px solid var(--paper-line);padding:12px;margin-bottom:10px;}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap;}
  .row + .row{border-top:1px solid var(--paper-line);}
  .name{flex:1;font-size:15px;font-weight:500;}
  .name.full-w{flex-basis:100%;}
  .idx{width:20px;font-size:12px;color:var(--ink-soft);}
  .seg{display:flex;border:1px solid var(--paper-line);border-radius:8px;overflow:hidden;}
  .seg button{border:none;background:#fff;padding:6px 10px;font-size:12.5px;font-family:inherit;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .seg button + button{border-left:1px solid var(--paper-line);}
  .seg button.on-ok{background:var(--ok);color:#fff;}
  .seg button.on-warn{background:var(--warn);color:#fff;}
  .seg button.on-bad{background:var(--bad);color:#fff;}
  .seg button.on-info{background:var(--info);color:#fff;}
  .seg.seg4{width:100%;}
  .seg.seg4 button{flex:1;font-size:11px;padding:7px 2px;text-align:center;}
  .note-input{width:100%;margin-top:6px;font-family:inherit;font-size:13px;border:1px solid var(--paper-line);border-radius:6px;padding:6px 8px;background:#FCFAF4;}
  textarea.note-input{resize:vertical;}
  .stat-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .pill{background:#fff;border:1px solid var(--paper-line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink-soft);}
  .pill b{color:var(--ink);}
  .counter-card{display:flex;align-items:center;justify-content:space-between;}
  .counter-num{font-size:28px;font-weight:800;}
  .counter-num.ok{color:var(--ok);}
  .counter-btns{display:flex;gap:8px;}
  .counter-btns button{width:38px;height:38px;border-radius:8px;border:1px solid var(--paper-line);background:#fff;font-size:18px;color:var(--ink);}
  .check-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;}
  .check-row input{width:20px;height:20px;}
  .tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--paper-line);max-width:520px;margin:0 auto;}
  .tabbar button{flex:1;border:none;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;color:var(--ink-soft);font-size:10.5px;}
  .tabbar button .dot{width:8px;height:8px;border-radius:50%;background:var(--paper-line);}
  .tabbar button.active{color:var(--ink);font-weight:700;}
  .tabbar button.active .dot{background:var(--role-color,var(--ink));}
  .subtab{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .subtab button{font-family:inherit;font-size:12.5px;padding:7px 12px;border-radius:8px;border:1px solid var(--paper-line);background:#fff;color:var(--ink-soft);}
  .subtab button.active{background:var(--role-color);color:#fff;border-color:var(--role-color);}
  .roster-edit-row{display:flex;gap:6px;align-items:center;padding:6px 0;}
  .roster-edit-row input[type=text]{flex:1;font-family:inherit;font-size:14px;border:1px solid var(--paper-line);border-radius:6px;padding:7px 8px;background:#FCFAF4;}
  .rm-btn{border:none;background:none;color:var(--bad);font-size:18px;padding:4px 6px;}
  .add-btn,.primary-btn{width:100%;padding:11px;border-radius:8px;border:none;background:var(--ink);color:#fff;font-family:inherit;font-weight:600;font-size:14px;margin-top:6px;}
  .primary-btn.role{background:var(--role-color);}
  .empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:24px 8px;}
  .badge-flag{display:inline-block;margin-top:6px;font-size:11px;background:#F6E4E1;color:var(--bad);border-radius:6px;padding:2px 6px;font-weight:700;}
  .week-name{font-weight:600;font-size:14px;}
  .week-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .bar-wrap{background:var(--paper-line);border-radius:4px;height:6px;margin-top:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--warn);}
  .disc-entry{padding:8px 0;border-top:1px solid var(--paper-line);font-size:13px;}
  .disc-entry:first-child{border-top:none;}
  .disc-pts{font-weight:800;white-space:nowrap;}
  .disc-pts.pos{color:var(--ok);}
  .disc-pts.neg{color:var(--bad);}
  select,.sel{font-family:inherit;font-size:13.5px;border:1px solid var(--paper-line);border-radius:8px;padding:7px 8px;background:#fff;color:var(--ink);width:100%;}
  label.field-label{font-size:12px;color:var(--ink-soft);display:block;margin:8px 0 3px;}
  .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const ROLE_META = {
  home:{label:'Danh sách lớp', short:'Lớp', color:'#1F2A44'},
  lt:{label:'Lớp trưởng', short:'Lớp trưởng', color:'#B23A2E'},
  hoctap:{label:'LP Học tập', short:'Học tập', color:'#2E5FA3'},
  laodong:{label:'LP Lao động', short:'Lao động', color:'#3A7D44'},
  kyluat:{label:'Kỷ luật', short:'Kỷ luật', color:'#A9791F'},
  gvcn:{label:'GVCN', short:'GVCN', color:'#5B4B8A'},
};
const ROLE_LOGIN_KEY = { lt:'lop-truong', hoctap:'hoc-tap', laodong:'lao-dong', gvcn:'gvcn' };

const CONG_CATEGORIES = [
  {label:'Thực hiện tốt vai trò trong ban cán sự lớp', pts:10},
  {label:'Được nhà trường tuyên dương', pts:15},
  {label:'Đạt giải đội tuyển / phong trào (TDTT, văn nghệ, cuộc thi, HSG)', pts:10},
  {label:'Tham gia tích cực đội tuyển / phong trào', pts:5},
  {label:'Đến cổ vũ đội tuyển / phong trào', pts:2},
  {label:'Được khen / điểm tốt trong sổ đầu bài', pts:5},
  {label:'Được khen bởi GVBM', pts:5},
  {label:'Đến sớm 15 phút trong hoạt động ngoài giờ học', pts:2},
  {label:'Có tiến bộ rõ rệt', pts:5},
  {label:'Giúp đỡ lớp, thầy cô, bạn bè', pts:5},
  {label:'Hỗ trợ vệ sinh của lớp', pts:2},
];
const VIPHAM_CATEGORIES = [
  {label:'Bạo lực học đường (ngôn từ, thể chất, tinh thần)', gay:3},
  {label:'Bè phái, chia rẽ tập thể', gay:3},
  {label:'Vô lễ với thầy cô, nhân viên nhà trường', gay:3},
  {label:'Dùng điện thoại sai quy định', gay:3},
  {label:'Trốn tiết, bỏ tiết, đi muộn không phép', gay:2},
  {label:'Vi phạm luật giao thông', gay:3},
  {label:'Thiếu trách nhiệm trong ban cán sự lớp', gay:2},
  {label:'Quên úp ghế, trực nhật', gay:1},
  {label:'Nói tục, chửi bậy, hành xử thiếu văn hoá', gay:1},
  {label:'Đổi chỗ tự do', gay:1},
  {label:'Bị ghi sổ đầu bài', gay:1},
  {label:'Vi phạm bị ghi tên trong sổ đầu bài', gay:1},
  {label:'Sai quy định về đầu tóc, trang phục', gay:1},
  {label:'Mang đồ ăn vào lớp', gay:1},
  {label:'Để lại rác trong lớp', gay:1},
  {label:'Đến muộn hoạt động ngoại khoá (không phép, ảnh hưởng chương trình)', gay:1},
];
const ASSIGNMENT_FIELDS = [
  {key:'lop_truong', title:'Lớp trưởng', desc:'Điều hành sinh hoạt đầu giờ, điểm danh, quản lý hòm điện thoại, đầu mối với GVCN.'},
  {key:'lp_hoc_tap', title:'Lớp phó học tập', desc:'Theo dõi BTVN, sổ đầu bài, nhắc bài tập, liên lạc GV bộ môn.'},
  {key:'lp_lao_dong', title:'Lớp phó lao động', desc:'Phân công & kiểm tra trực nhật, quản lý cơ sở vật chất lớp.'},
  {key:'lp_van_the_my', title:'Lớp phó văn thể mỹ', desc:'Phụ trách hoạt động văn nghệ, thể thao, phong trào, trang trí lớp.'},
  {key:'lp_doi_ngoai', title:'Lớp phó đối ngoại', desc:'Đầu mối liên lạc, đối ngoại của lớp với các bên liên quan.'},
  {key:'bi_thu', title:'Bí thư', desc:'Phụ trách công tác Đoàn, sinh hoạt Đoàn định kỳ. (Chưa bầu — chờ đại hội)'},
  {key:'to_truong_1', title:'Tổ trưởng Tổ 1', desc:'Theo dõi nền nếp, ghi nhận điểm cộng/vi phạm cho các bạn Tổ 1.'},
  {key:'to_truong_2', title:'Tổ trưởng Tổ 2', desc:'Theo dõi nền nếp, ghi nhận điểm cộng/vi phạm cho các bạn Tổ 2.'},
  {key:'to_truong_3', title:'Tổ trưởng Tổ 3', desc:'Theo dõi nền nếp, ghi nhận điểm cộng/vi phạm cho các bạn Tổ 3.'},
];

let state = {
  tab: 'home',
  date: todayStr(),
  month: monthStr(todayStr()),
  roster: null,
  loading: true,
  sub: {home:'ds', hoctap:'today', laodong:'today', kyluat:'to-1'},
  unlocked: {},
};
let disciplineForm = {type:'cong', studentId:'', category:''};
let ldDayData = null, ltData = null, htData = null, ldConfig = null;

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthStr(dateStr){ return dateStr.slice(0,7); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 1400);
}

// ====== CẤU HÌNH KHO DỮ LIỆU (Google Sheets qua Apps Script) ======
const API_URL = 'https://script.google.com/macros/s/AKfycbykQfvYnE7ERzNQqz6kQI01ZjDSgjZAZvrVaTxDStSzvSy2lQFSppveNRxHtltP8oTKKQ/exec';
const API_TOKEN = 'Lop10b1@2026';
// ====================================================================

async function sget(key){
  try{
    const url = `${API_URL}?action=get&key=${encodeURIComponent(key)}&token=${encodeURIComponent(API_TOKEN)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data.value ? JSON.parse(data.value) : null;
  } catch(e){ console.error('sget failed', key, e); return null; }
}
async function sset(key, value){
  try{
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'set', key, value: JSON.stringify(value), token: API_TOKEN }) });
    const data = await res.json();
    return !!data.ok;
  } catch(e){ console.error('sset failed', key, e); showToast('Lỗi lưu dữ liệu — kiểm tra kết nối mạng'); return false; }
}
async function doLogin(role, passcode){
  try{
    const url = `${API_URL}?action=login&role=${encodeURIComponent(role)}&passcode=${encodeURIComponent(passcode)}&token=${encodeURIComponent(API_TOKEN)}`;
    const res = await fetch(url);
    const data = await res.json();
    return !!data.ok;
  } catch(e){ return false; }
}

async function loadRoster(){ let r = await sget('roster'); state.roster = Array.isArray(r) ? r : []; }
async function saveRoster(){ await sset('roster', state.roster); }

async function init(){
  if(!API_URL || API_URL.indexOf('DÁN_URL') === 0){
    document.getElementById('app').innerHTML = `
      <div style="padding:32px 20px;text-align:center;color:#1F2A44;">
        <h2 style="margin-bottom:8px;">Chưa gắn kho dữ liệu</h2>
        <p style="color:#5B6580;font-size:14px;">Tìm dòng <code>API_URL</code> gần đầu file &lt;script&gt; và dán URL Web App Apps Script vào, rồi tải lại trang.</p>
      </div>`;
    return;
  }
  await loadRoster();
  state.loading = false;
  render();
}

function render(){
  if(state.loading){ document.getElementById('app').innerHTML = '<div style="padding:40px;text-align:center;color:#5B6580;">Đang tải…</div>'; return; }
  renderAsync();
}

function cover(title, sub, bg, showDate){
  const dateBar = showDate ? `
    <div class="datebar">
      <input type="date" id="dateInput" value="${state.date}">
      <button class="today-btn" data-act="today">Hôm nay</button>
    </div>` : '';
  return `<div class="cover" style="background:${bg}"><p class="role-label">SỔ QUẢN LÝ LỚP 10B1</p><h1>${title}</h1><p class="sub">${sub}</p></div>${dateBar}`;
}
function tabbar(){
  return `<div class="tabbar">${Object.entries(ROLE_META).map(([key,r])=>`
    <button data-tab="${key}" class="${state.tab===key?'active':''}" style="--role-color:${r.color}"><span class="dot"></span>${r.short}</button>
  `).join('')}</div>`;
}
function subtabs(group, items){
  const color = ROLE_META[state.tab].color;
  return `<div class="subtab">${items.map(([key,label])=>
    `<button data-subtab="${group}:${key}" class="${state.sub[group]===key?'active':''}" style="--role-color:${color}">${label}</button>`
  ).join('')}</div>`;
}
function lockBody(label, color, roleKey){
  return `<div class="card" style="text-align:center;padding:28px 16px;">
    <p style="font-weight:700;margin-bottom:4px;">${label} cần mật khẩu</p>
    <p class="week-sub" style="margin-bottom:14px;">Nhập mật khẩu được cấp để mở trang này.</p>
    <input type="password" class="note-input" id="passcodeInput" placeholder="Mật khẩu" style="text-align:center;margin-bottom:10px;">
    <button class="primary-btn" style="background:${color};" data-act="do-login" data-role="${roleKey}">Mở khoá</button>
    <p id="loginError" class="week-sub" style="color:var(--bad);margin-top:8px;"></p>
  </div>`;
}
function emptyRoster(){ return '<p class="empty">Chưa có học sinh — vào tab "Lớp" để nhập danh sách.</p>'; }
function formatDateVN(ds){ const [y,m,d]=ds.split('-'); return `${d}/${m}/${y}`; }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

// ============ RENDER PIPELINE ============
async function renderAsync(){
  const app = document.getElementById('app');
  const role = ROLE_META[state.tab];
  let coverHtml, mainHtml;

  if(state.tab === 'home'){
    coverHtml = cover('Danh sách lớp', `${state.roster.length} học sinh · Sổ dùng chung cho ban cán sự`, role.color, false);
    mainHtml = await renderHome();
  } else if(state.tab === 'lt'){
    coverHtml = cover('Lớp trưởng', 'Điểm danh · Thu điện thoại · Kiểm tra hòm', role.color, true);
    mainHtml = await guarded('lop-truong', renderLT);
  } else if(state.tab === 'hoctap'){
    coverHtml = cover('LP Học tập', 'Truy bài đầu giờ (15 phút)', role.color, true);
    mainHtml = await guarded('hoc-tap', renderHocTap);
  } else if(state.tab === 'laodong'){
    coverHtml = cover('LP Lao động', 'Phân công & kiểm tra trực nhật', role.color, true);
    mainHtml = await guarded('lao-dong', renderLaoDong);
  } else if(state.tab === 'kyluat'){
    coverHtml = cover('Kỷ luật', 'Điểm nền nếp theo tổ — điểm cộng & vi phạm', role.color, true);
    const subHtml = subtabs('kyluat', [['to-1','Tổ 1'],['to-2','Tổ 2'],['to-3','Tổ 3']]);
    if(!state.unlocked[state.sub.kyluat]){
      mainHtml = `<main>${subHtml}${lockBody('Tổ trưởng Tổ '+state.sub.kyluat.split('-')[1], role.color, state.sub.kyluat)}</main>`;
    } else {
      mainHtml = await renderKyLuat(subHtml);
    }
  } else if(state.tab === 'gvcn'){
    coverHtml = cover('GVCN', 'Tổng hợp tình hình lớp', role.color, true);
    mainHtml = await guarded('gvcn', renderGVCN);
  }

  app.innerHTML = coverHtml + mainHtml + tabbar();
  attachHandlers();
}
async function guarded(roleKey, renderFn){
  if(!state.unlocked[roleKey]) return `<main>${lockBody(ROLE_META[state.tab].label, ROLE_META[state.tab].color, roleKey)}</main>`;
  return await renderFn();
}

// ---------- HOME ----------
async function renderHome(){
  if(state.sub.home !== 'phancong'){
    const rows = state.roster.map((s,i)=>`
      <div class="roster-edit-row" data-id="${s.id}">
        <span class="idx">${i+1}</span>
        <input type="text" class="rname" value="${escapeAttr(s.name)}" placeholder="Họ và tên">
        <select class="rto sel" style="width:78px;flex:none;" data-id="${s.id}">
          <option value="" ${!s.to?'selected':''}>Tổ?</option>
          <option value="1" ${s.to===1?'selected':''}>Tổ 1</option>
          <option value="2" ${s.to===2?'selected':''}>Tổ 2</option>
          <option value="3" ${s.to===3?'selected':''}>Tổ 3</option>
        </select>
        <button class="rm-btn" data-act="rm-student" data-id="${s.id}">✕</button>
      </div>`).join('');
    return `<main>
      ${subtabs('home', [['ds','Danh sách'],['phancong','Phân công nhiệm vụ']])}
      <h2 class="section">Danh sách học sinh (${state.roster.length})</h2>
      <div class="card">
        ${rows || '<p class="empty">Chưa có học sinh nào.</p>'}
        <button class="add-btn" data-act="add-student" style="background:#fff;color:var(--ink);border:1px dashed var(--paper-line);">+ Thêm học sinh</button>
      </div>
      <button class="primary-btn" data-act="save-roster">Lưu danh sách</button>
      <p style="text-align:center;font-size:12px;color:var(--ink-soft);margin-top:10px;">Chọn Tổ cho từng bạn để 3 tổ trưởng chỉ thấy đúng danh sách tổ mình.</p>
    </main>`;
  } else {
    const assign = await sget('assignments') || {};
    const rows = ASSIGNMENT_FIELDS.map(f=>`
      <div class="card" style="margin-bottom:8px;">

    </main>`;

async function computeWeekly(){
  const dates = [];
  const d = new Date(state.date+'T00:00:00');
  for(let i=0;i<7;i++){ const dd=new Date(d); dd.setDate(d.getDate()-i); dates.push(dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0')); }
  const result = {};
  for(const dt of dates){
    const rec = await sget('study:'+dt);
    if(!rec) continue;
    for(const [sid, st] of Object.entries(rec.status||{})){
      if(!result[sid]) result[sid] = {partial:0, none:0, noequip:0};
      if(st==='partial') result[sid].partial++;
      if(st==='none') result[sid].none++;
      if(st==='noequip') result[sid].noequip++;
    }
  }
  return result;
}

function computeAssigned(dateStr){
  if(!ldConfig || ldConfig.order.length===0) return [];
  const start = new Date(ldConfig.startDate+'T00:00:00');
  const cur = new Date(dateStr+'T00:00:00');
  const dayIndex = Math.floor((cur-start)/86400000);
  const n = ldConfig.order.length;
  const size = Math.max(1, parseInt(ldConfig.groupSize)||1);
  const groups = Math.ceil(n/size);
  if(dayIndex < 0 || groups===0) return ldConfig.order.slice(0,size);
  const g = ((dayIndex % groups)+groups) % groups;
  return ldConfig.order.slice(g*size, g*size+size);
}

// ---------- KỶ LUẬT (3 TỔ TRƯỞNG) ----------
function monthOf(dateStr){ return dateStr.slice(0,7); }
function prevMonths(month, n){
  const [y,m] = month.split('-').map(Number);
  const arr=[];
  for(let i=0;i<n;i++){ let mm=m-i, yy=y; while(mm<=0){mm+=12; yy-=1;} arr.push(yy+'-'+String(mm).padStart(2,'0')); }
  return arr;
}
function aggregateMonth(log, month){
  const agg = {};
  log.forEach(e=>{
    if(monthOf(e.date) !== month) return;
    if(!agg[e.studentId]) agg[e.studentId] = {cong:0, gay:0};
    if(e.type==='cong') agg[e.studentId].cong += e.value; else agg[e.studentId].gay += e.value;
  });
  return agg;
}
function gayTier(total){
  if(total>=3) return {label:'Báo phụ huynh, cân nhắc hạnh kiểm tháng'};
  if(total===2) return {label:'Viết kiểm điểm + phạt trực nhật 3 ngày'};
  if(total===1) return {label:'Khiển trách'};
  return null;
}
function quyenLoiTier(total){
  const badges=[];
  if(total>50) badges.push('Đổi chỗ ngồi theo ý muốn');
  if(total>=40) badges.push('Quà to + tuyên dương');
  else if(total>=20) badges.push('Quà nhỏ + tuyên dương');
  return badges;
}

async function renderGVCN(){

  const lateList=[], absentList=[];
  state.roster.forEach(s=>{ const st=att.status[s.id]||'present'; if(st==='late') lateList.push(s.name); else if(st==='absent') absentList.push(s.name); });
  const study = await sget('study:'+state.date) || {status:{}, remind:false};
  const issueList = state.roster.filter(s=> ['partial','none','noequip'].includes(study.status[s.id])).map(s=>({name:s.name, st:study.status[s.id]}));
  const duty = await sget('duty:'+state.date) || null;
  const dutyNames = duty ? duty.assigned.map(id=>state.roster.find(s=>s.id===id)?.name||'?') : [];
  const log = await sget('discipline:log') || [];
  const agg = aggregateMonth(log, state.month);

      const a = agg[s.id]||{cong:0,gay:0};
      const tier = gayTier(a.gay);

  const assign = await sget('assignments') || {};
  const assignRows = ASSIGNMENT_FIELDS.map(f=>`<div class="row"><span class="name">${f.title}</span><span class="week-sub">${escapeHtml(assign[f.key]||'(chưa có)')}</span></div>`).join('');

  return `<main>
    <h2 class="section">Điểm danh ngày ${formatDateVN(state.date)}</h2>
    <div class="card">
      <div class="week-sub">Vắng: ${absentList.join(', ')||'không có'}</div>
      <div class="week-sub">Muộn: ${lateList.join(', ')||'không có'}</div>
      <div class="week-sub">Thu điện thoại: ${att.phoneCount}/${state.roster.length} · Hòm: ${att.openedBox?'đã mở':'chưa mở'} / ${att.closedBox?'đã dọn':'chưa dọn'}</div>
    </div>
    <h2 class="section">Truy bài hôm nay</h2>
    <div class="card">
      ${issueList.length ? issueList.map(x=>`<div class="week-sub">${escapeHtml(x.name)} — ${x.st==='partial'?'thiếu bài':x.st==='none'?'không làm bài':'thiếu dụng cụ'}</div>`).join('') : '<p class="empty">Không có vấn đề gì hôm nay.</p>'}
      <div class="week-sub" style="margin-top:6px;">Đã nhắc BTVN: ${study.remind?'✓ rồi':'chưa'}</div>
    </div>
    <h2 class="section">Trực nhật hôm nay</h2>
    <div class="card">
      <div class="week-sub">${dutyNames.join(', ')||'chưa phân công'}</div>
      <div class="week-sub">Kiểm tra: ${duty && duty.checked==='pass'?'Đạt':duty && duty.checked==='fail'?'Chưa đạt':'chưa kiểm tra'}${duty && duty.note?(' — '+escapeHtml(duty.note)):''}</div>

  app.querySelectorAll('[data-tab]').forEach(btn=>{ btn.onclick = ()=>{ state.tab = btn.dataset.tab; render(); }; });
  app.querySelectorAll('[data-subtab]').forEach(btn=>{
    btn.onclick = ()=>{

      state.sub[group] = key;
      if(group==='kyluat'){ disciplineForm = {type:'cong', studentId:'', category:''}; }
      renderAsync();
    };
  });
  const dateInput = document.getElementById('dateInput');
  if(dateInput) dateInput.onchange = ()=>{ state.date = dateInput.value; renderAsync(); };
  const todayBtn = app.querySelector('[data-act="today"]');
  if(todayBtn) todayBtn.onclick = ()=>{ state.date = todayStr(); renderAsync(); };

  if(loginBtn) loginBtn.onclick = async ()=>{

  // HOME

  if(addStudentBtn) addStudentBtn.onclick = ()=>{
    state.roster.push({id:uid(), name:'', to:null});

  app.querySelectorAll('.rname').forEach((inp,i)=>{ inp.oninput = ()=>{ state.roster[i].name = inp.value; }; });

    sel.onchange = ()=>{ const s = state.roster.find(x=>x.id===sel.dataset.id); if(s) s.to = sel.value ? parseInt(sel.value) : null; };
  });
  const saveRosterBtn = app.querySelector('[data-act="save-roster"]');
  if(saveRosterBtn) saveRosterBtn.onclick = async ()=>{
    state.roster = state.roster.filter(s=>s.name.trim()!=='');
    await saveRoster();
    showToast('Đã lưu danh sách lớp');
    render();
  };
  const saveAssignBtn = app.querySelector('[data-act="save-assignments"]');
  if(saveAssignBtn) saveAssignBtn.onclick = async ()=>{
    const obj = {};
    app.querySelectorAll('.assign-input').forEach(inp=>{ obj[inp.dataset.key] = inp.value; });
    await sset('assignments', obj);
    showToast('Đã lưu phân công nhiệm vụ');
  };

  // LT
  app.querySelectorAll('[data-group="att"]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(btn=>{
      btn.onclick = async ()=>{ ltData.status[seg.dataset.id] = btn.dataset.val; await sset('attendance:'+state.date, ltData); renderAsync(); };
    });
  });
  const phoneInc = app.querySelector('[data-act="phone-inc"]');
  const phoneDec = app.querySelector('[data-act="phone-dec"]');
  if(phoneInc) phoneInc.onclick = async ()=>{ ltData.phoneCount = Math.min(state.roster.length, (ltData.phoneCount||0)+1); await sset('attendance:'+state.date, ltData); renderAsync(); };
  if(phoneDec) phoneDec.onclick = async ()=>{ ltData.phoneCount = Math.max(0, (ltData.phoneCount||0)-1); await sset('attendance:'+state.date, ltData); renderAsync(); };
  const chkOpen = app.querySelector('[data-act="chk-open"]');
  if(chkOpen) chkOpen.onchange = async ()=>{ ltData.openedBox = chkOpen.checked; await sset('attendance:'+state.date, ltData); };
  const chkClose = app.querySelector('[data-act="chk-close"]');
  if(chkClose) chkClose.onchange = async ()=>{ ltData.closedBox = chkClose.checked; await sset('attendance:'+state.date, ltData); };

  // HOC TAP
  app.querySelectorAll('[data-group="study"]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(btn=>{
      btn.onclick = async ()=>{ htData.status[seg.dataset.id] = btn.dataset.val; await sset('study:'+state.date, htData); renderAsync(); };
    });
  });
  const chkRemind = app.querySelector('[data-act="chk-remind"]');
  if(chkRemind) chkRemind.onchange = async ()=>{ htData.remind = chkRemind.checked; await sset('study:'+state.date, htData); };

  // LAO DONG
  app.querySelectorAll('[data-act="toggle-duty"]').forEach(chk=>{
    chk.onchange = async ()=>{
      const id = chk.dataset.id;
      const idx = ldDayData.assigned.indexOf(id);
      if(idx>=0) ldDayData.assigned.splice(idx,1); else ldDayData.assigned.push(id);
      await sset('duty:'+state.date, ldDayData);
    };
  });
  app.querySelectorAll('[data-group="duty-check"] button').forEach(btn=>{
    btn.onclick = async ()=>{ ldDayData.checked = btn.dataset.val; await sset('duty:'+state.date, ldDayData); renderAsync(); };
  });
  const saveDutyNoteBtn = app.querySelector('[data-act="save-duty-note"]');
  if(saveDutyNoteBtn) saveDutyNoteBtn.onclick = async ()=>{
    ldDayData.note = document.getElementById('dutyNote').value;
    await sset('duty:'+state.date, ldDayData);
    showToast('Đã lưu nhận xét trực nhật');
  };
  const saveDutyConfigBtn = app.querySelector('[data-act="save-duty-config"]');
  if(saveDutyConfigBtn) saveDutyConfigBtn.onclick = async ()=>{
    ldConfig.groupSize = Math.max(1, parseInt(document.getElementById('groupSizeInput').value)||1);
    ldConfig.startDate = document.getElementById('startDateInput').value || state.date;
    await sset('duty:config', ldConfig);
    showToast('Đã lưu cài đặt');
    renderAsync();
  };

  // KY LUAT
  app.querySelectorAll('[data-form-type]').forEach(btn=>{
    btn.onclick = ()=>{ disciplineForm.type = btn.dataset.formType; disciplineForm.category=''; renderAsync(); };
  });
  const discStudentSel = document.getElementById('discStudent');
  if(discStudentSel) discStudentSel.onchange = ()=>{ disciplineForm.studentId = discStudentSel.value; };
  const discCatSel = document.getElementById('discCategory');
  if(discCatSel) discCatSel.onchange = ()=>{ disciplineForm.category = discCatSel.value; renderAsync(); };
  const addDiscBtn = app.querySelector('[data-act="add-disc"]');
  if(addDiscBtn) addDiscBtn.onclick = async ()=>{
    const studentId = document.getElementById('discStudent').value;
    const category = document.getElementById('discCategory').value;
    const note = document.getElementById('discNote').value.trim();
    if(!studentId){ showToast('Chọn học sinh trước đã'); return; }
    let value;
    if(category === 'Khác'){
      value = parseInt(document.getElementById('discCustomValue').value);
      if(isNaN(value)){ showToast('Nhập số điểm/gậy hợp lệ'); return; }
    } else {
      const list = disciplineForm.type==='cong' ? CONG_CATEGORIES : VIPHAM_CATEGORIES;
      const found = list.find(c=>c.label===category);
      value = disciplineForm.type==='cong' ? found.pts : found.gay;
    }
    const log = await sget('discipline:log') || [];
    log.push({id:uid(), studentId, type:disciplineForm.type, category, value, note, date: state.date});
    await sset('discipline:log', log);
    showToast('Đã lưu ghi nhận');
    disciplineForm.studentId=''; disciplineForm.category='';
    renderAsync();
  };
}

init();
</script>
</body>
</html>
