<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Lớp 10B1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Blue background + white cards */
  --bg:#1048C8;
  --surf:#FFFFFF;
  --surf2:#EEF2FF;
  --border:rgba(16,72,200,0.12);
  --text:#0D1A40;
  --text-dim:#3A4A80;
  --muted:#7A8AB8;
  --accent:#1048C8;
  --ok:#1A9B5F;
  --warn:#D08A00;
  --bad:#D63030;
  --teal:#1A9B5F;
  --red:#D63030;
  --amber:#D08A00;
  --info:#7A8AB8;
  --navy:#0D1A40;
  --role-color:#1048C8;
  --radius:16px;
  --shadow:0 8px 32px rgba(10,30,100,0.18);
  --shadow-sm:0 2px 12px rgba(10,30,100,0.10);
  --glass:rgba(255,255,255,0.10);
  --glass-border:rgba(255,255,255,0.22);
  --blur:blur(20px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  margin:0;
  font-family:'Be Vietnam Pro',system-ui,sans-serif;
  background:linear-gradient(145deg, #0A35B0 0%, #1048C8 40%, #1A5CE0 100%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
.app{max-width:480px;margin:0 auto;padding-bottom:92px;min-height:100vh;background:#F0F4FF;}

/* COVER */
.cover{
  padding:52px 20px 22px;
  position:relative;overflow:hidden;
  background:linear-gradient(160deg, rgba(74,158,255,0.25) 0%, rgba(255,255,255,0.05) 100%);
  border-bottom:1px solid var(--glass-border);
}
.cover::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(160deg, color-mix(in srgb, var(--role-color) 30%, transparent) 0%, transparent 70%);
  pointer-events:none;
}
.cover-blob{
  position:absolute;top:-60px;right:-60px;width:200px;height:200px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
  opacity:1;pointer-events:none;
}
.cover-blob2{
  position:absolute;bottom:-50px;left:-20px;width:140px;height:140px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(74,158,255,0.18) 0%, transparent 70%);
  opacity:1;pointer-events:none;
}
.cover .eyebrow{font-size:10px;letter-spacing:.14em;font-weight:700;color:var(--muted);text-transform:uppercase;margin:0 0 8px;position:relative;z-index:1;}
.cover h1{margin:0;font-size:26px;font-weight:800;line-height:1.2;color:#fff;position:relative;z-index:1;}
.cover .sub{margin:5px 0 0;font-size:13px;color:var(--text-dim);position:relative;z-index:1;}

/* DATE BAR */
.datebar{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;background:var(--surf);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);
  box-shadow:0 2px 10px rgba(10,30,100,0.08);
}
.datebar input[type=date]{
  font-family:inherit;font-size:13px;border:1px solid var(--border);
  background:var(--surf2);border-radius:12px;padding:7px 10px;color:var(--text);flex:1;
}
.datebar input[type=date]::-webkit-calendar-picker-indicator{opacity:.5;}
.datebar .today-btn{
  font-size:12px;font-family:inherit;font-weight:600;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:12px;padding:7px 12px;color:var(--muted);white-space:nowrap;cursor:pointer;
}

/* MAIN */
main{padding:16px 16px 8px;}
h2.section{font-size:11px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;}
h2.section input[type=month]{font-family:inherit;font-size:12px;border:1px solid var(--border);border-radius:10px;padding:4px 8px;background:var(--surf2);color:var(--text);margin-left:8px;letter-spacing:0;}

/* CARD */
.card{background:var(--surf);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);}

/* ROW */
.row{display:flex;align-items:center;gap:10px;padding:11px 0;flex-wrap:wrap;}
.row+.row{border-top:1px solid var(--border);}
.name{flex:1;font-size:14px;font-weight:500;}
.name.full-w{flex-basis:100%;}
.idx{width:22px;font-size:11px;color:var(--muted);font-weight:600;text-align:right;}

/* SEGMENTED */
.seg{display:flex;background:var(--surf2);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
.seg button{border:none;background:none;padding:8px 10px;font-size:12px;font-family:inherit;font-weight:600;color:var(--muted);cursor:pointer;flex:1;transition:background .15s,color .15s;white-space:nowrap;}
.seg button+button{border-left:1px solid var(--border);}
.seg button.on-ok{background:var(--ok);color:#fff;}
.seg button.on-warn{background:var(--warn);color:#fff;}
.seg button.on-bad{background:var(--bad);color:#fff;}
.seg button.on-info{background:var(--surf);color:var(--muted);}
.seg.seg4{width:100%;}
.seg.seg4 button{font-size:11px;padding:8px 4px;}

/* INPUTS */
.note-input{width:100%;margin-top:6px;font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surf2);color:var(--text);}
.note-input::placeholder{color:var(--muted);}
textarea.note-input{resize:vertical;}

/* PILLS */
.stat-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.pill{background:var(--surf);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--muted);box-shadow:var(--shadow-sm);}
.pill b{color:var(--text);}

/* COUNTER */
.counter-card{display:flex;align-items:center;justify-content:space-between;}
.counter-num{font-size:48px;font-weight:800;line-height:1;letter-spacing:-.03em;}
.counter-num.ok{color:var(--ok);}
.counter-btns{display:flex;gap:8px;}
.counter-btns button{width:46px;height:46px;border-radius:50%;border:none;background:var(--surf2);font-size:20px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}

/* CHECK ROW */
.check-row{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px;cursor:pointer;}
.check-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;}

/* TABBAR */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;display:flex;
  background:var(--surf);
  border-top:1px solid var(--border);
  box-shadow:0 -4px 20px rgba(10,30,100,0.12);
  backdrop-filter:blur(20px);max-width:480px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.tabbar button{flex:1;border:none;background:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;color:var(--muted);font-size:9px;font-weight:600;letter-spacing:.03em;cursor:pointer;transition:color .15s;}
.tabbar button .ticon{
  font-size:18px;line-height:1;width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:transparent;transition:background .2s,transform .15s;
}
.tabbar button.active .ticon{background:color-mix(in srgb, var(--role-color) 13%, transparent);}
.tabbar button.active{color:var(--role-color);}
.tabbar button.active .ticon{transform:scale(1.08);}

/* SUBTABS */
.subtab{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.subtab button{font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:999px;border:none;background:var(--surf2);color:var(--muted);cursor:pointer;transition:all .15s;}
.subtab button.active{background:var(--role-color);color:#fff;}

/* ROSTER EDIT */
.roster-edit-row{display:flex;gap:8px;align-items:center;padding:7px 0;}
.roster-edit-row+.roster-edit-row{border-top:1px solid var(--border);}
.roster-edit-row input[type=text]{flex:1;font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:12px;padding:9px 10px;background:var(--surf2);color:var(--text);}
.roster-edit-row input[type=text]::placeholder{color:var(--muted);}
.rm-btn{border:none;background:none;color:var(--bad);font-size:18px;padding:4px 6px;cursor:pointer;}
.select-to{font-family:inherit;font-size:12px;border:1px solid var(--border);border-radius:10px;padding:7px 8px;background:var(--surf2);color:var(--text);width:74px;flex:none;}

/* BUTTONS */
.add-btn,.primary-btn{width:100%;padding:14px;border-radius:14px;border:none;font-family:inherit;font-weight:700;font-size:14px;margin-top:8px;cursor:pointer;transition:opacity .15s;}
.add-btn{background:var(--surf2);color:var(--muted);border:1.5px dashed var(--border);}
.primary-btn{background:var(--role-color);color:#fff;}

/* MISC */
.empty{text-align:center;color:var(--muted);font-size:13px;padding:28px 8px;}
.badge-flag{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;background:rgba(214,48,48,.10);color:var(--bad);border-radius:8px;padding:3px 10px;}
.week-name{font-weight:600;font-size:14px;}
.week-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.bar-wrap{background:var(--surf2);border-radius:4px;height:4px;margin-top:8px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;}
.week-card{background:var(--surf);border-radius:var(--radius);padding:14px;margin-bottom:8px;box-shadow:var(--shadow-sm);}

/* DISCIPLINE */
.disc-entry{padding:10px 0;border-top:1px solid var(--border);font-size:13px;}
.disc-entry:first-child{border-top:none;}
.disc-pts{font-weight:700;font-size:15px;white-space:nowrap;}
.disc-pts.pos{color:var(--ok);}
.disc-pts.neg{color:var(--bad);}
.disc-summary{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.score-block{text-align:center;}
.score-block .score-num{font-size:34px;font-weight:800;line-height:1;}
.score-block .score-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

/* DISCIPLINE CHIPS */
.stu-chip{font-size:13px;padding:7px 13px;border-radius:20px;border:1.5px solid var(--border);background:transparent;cursor:pointer;font-family:inherit;transition:background .15s,color .15s,border-color .15s;line-height:1.4;color:var(--text);}
.stu-chip-active{border-color:var(--accent);background:var(--accent);color:#fff;}
.disc-chip{font-size:11px;padding:4px 9px;border-radius:20px;border:1.5px solid;background:transparent;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;line-height:1.4;white-space:nowrap;}
.vipham-chip{border-color:var(--red);color:var(--red);}
.vipham-chip.active{background:var(--red);color:#fff;}
.cong-chip{border-color:var(--teal);color:var(--teal);}
.cong-chip.active{background:var(--teal);color:#fff;}
.disc-chip-label{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px;}
details[open] .details-arrow{display:inline-block;transform:rotate(90deg);}
.details-arrow{display:inline-block;transition:transform .15s;}

/* SELECT */
select,.sel{font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:12px;padding:9px 10px;background:var(--surf2);color:var(--text);width:100%;-webkit-appearance:none;}
label.field-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin:12px 0 4px;}

/* LOCK */
.lock-screen{margin:40px 0;text-align:center;padding:0 8px;}
.lock-screen .lock-icon{font-size:48px;margin-bottom:14px;}
.lock-screen h3{font-size:20px;font-weight:800;margin:0 0 6px;}
.lock-screen p{color:var(--muted);font-size:13px;margin:0 0 20px;}
.lock-screen input{width:100%;font-family:inherit;font-size:15px;font-weight:600;background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:13px;color:var(--text);text-align:center;letter-spacing:.2em;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.lock-screen input::placeholder{color:var(--muted);letter-spacing:.02em;font-weight:400;font-size:13px;}
#loginError{color:var(--bad);font-size:12px;margin-top:4px;}

/* TOAST */
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-size:14px;}

/* LOGIN SPLASH — blue bg + white card */
.login-splash{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 20px 40px;
  background:linear-gradient(145deg, #0A35B0 0%, #1048C8 50%, #1A5CE0 100%);
  position:relative;overflow:hidden;
}
/* Floating circles like the reference */
.splash-blob{
  position:absolute;top:-60px;right:-60px;width:260px;height:260px;
  border-radius:50%;
  background:radial-gradient(circle at 40% 40%, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, transparent 80%);
  animation:blobDrift 10s ease-in-out infinite alternate;
  pointer-events:none;
}
.splash-blob2{
  position:absolute;bottom:-80px;left:-40px;width:220px;height:220px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.10) 0%, transparent 70%);
  animation:blobDrift2 12s ease-in-out infinite alternate;
  pointer-events:none;
}
.splash-blob3{
  position:absolute;top:35%;right:-30px;width:120px;height:120px;
  border-radius:50%;
  background:rgba(255,255,255,0.07);
  pointer-events:none;
}
@keyframes blobDrift{
  from{transform:translate(0,0) scale(1);}
  to{transform:translate(-12px,18px) scale(1.06);}
}
@keyframes blobDrift2{
  from{transform:translate(0,0) scale(1);}
  to{transform:translate(10px,-14px) scale(1.04);}
}
.login-splash .brand{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,0.65);margin-bottom:8px;position:relative;z-index:1;}
.login-splash h1{font-size:26px;font-weight:800;margin:0 0 4px;color:#fff;position:relative;z-index:1;}
.login-splash .tagline{color:rgba(255,255,255,0.65);font-size:13px;margin:0 0 22px;text-align:center;position:relative;z-index:1;}
/* WHITE card — dark text, readable */
.login-glass-card{
  width:100%;max-width:360px;
  background:#FFFFFF;
  border-radius:24px;
  padding:24px 20px 20px;
  box-shadow:0 20px 60px rgba(5,20,80,0.35);
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-bottom:4px;}
.role-card{
  background:#F0F4FF;
  border:1.5px solid rgba(16,72,200,0.10);
  border-radius:16px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;transition:transform .15s,box-shadow .15s,background .15s;
  -webkit-tap-highlight-color:transparent;
}
.role-card:active{transform:scale(.97);}
.role-card .rc-icon-wrap{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(16,72,200,0.09);font-size:22px;transition:background .15s;}
.role-card .rc-label{font-size:12px;font-weight:600;text-align:center;color:#0D1A40;}
.role-card.selected{background:#E8EFFF;border-color:rgba(16,72,200,0.40);box-shadow:0 0 0 2px rgba(16,72,200,0.20);}
.role-card.selected .rc-icon-wrap{background:rgba(16,72,200,0.16);}
.viewer-btn{
  width:100%;padding:12px;border-radius:14px;
  border:1.5px solid rgba(16,72,200,0.18);
  background:transparent;
  color:#7A8AB8;
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  transition:background .15s;
}
.login-pass-box{
  width:100%;
  background:#F0F4FF;
  border:1px solid rgba(16,72,200,0.12);
  border-radius:18px;padding:18px 16px;margin-bottom:0;
  animation:slideUp .18s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.login-pass-box .lp-title{font-size:14px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:#0D1A40;}
.login-pass-box input{
  width:100%;font-family:inherit;font-size:15px;font-weight:600;
  background:#fff;border:1.5px solid rgba(16,72,200,0.20);
  border-radius:12px;padding:12px;color:#0D1A40;text-align:center;letter-spacing:.2em;margin-bottom:10px;
}
.login-pass-box input::placeholder{color:#A0AABF;letter-spacing:.02em;font-weight:400;font-size:13px;}
.login-pass-box .lp-err{color:var(--bad);font-size:12px;margin-bottom:8px;min-height:18px;}
.login-pass-box .lp-submit{width:100%;padding:13px;border-radius:12px;border:none;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:opacity .15s;background:#1048C8;color:#fff;}
/* Score table */
.score-table td,.score-table th{padding:8px 7px;text-align:center;border-bottom:1px solid #EEF3FF;white-space:nowrap;}
.score-table tbody tr:nth-child(even){background:#F8FAFF;}
.score-table tbody tr:hover{background:#EEF3FF;}

</style>
</head>

function downloadCSV(filename, rows){
  const bom = '﻿'; // UTF-8 BOM để Excel đọc tiếng Việt
  const csv = bom + rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// ====================================

const _cache = {};

// ── localStorage (stale-while-revalidate) ──
const LS_PFX = 'lop10b1:';
// Dữ liệu tĩnh (roster, assignments): cache 1 giờ
// Dữ liệu ngày (attendance, study, duty, discipline): cache 90 giây
const LS_TTL_STATIC = 60 * 60 * 1000;
const LS_TTL_DAILY  =  90 * 1000;
function isDynamicKey(key){
  return /^(attendance|study|duty|discipline):/.test(key);
}
function lsGet(key){
  try{
    const raw = localStorage.getItem(LS_PFX + key);
    if(!raw) return undefined;
    const {v, t} = JSON.parse(raw);
    const ttl = isDynamicKey(key) ? LS_TTL_DAILY : LS_TTL_STATIC;
    if(Date.now() - t > ttl) return undefined;
    return v;
  } catch(e){ return undefined; }
}
function lsSet(key, value){
  try{ localStorage.setItem(LS_PFX + key, JSON.stringify({v:value, t:Date.now()})); } catch(e){}
}

// ── Background revalidation (stale-while-revalidate) ──
const _bgPending = new Set();
const _recentWrites = {}; // key → timestamp, tránh overwrite data vừa lưu
const WRITE_GUARD_MS = 20000; // 20 giây sau khi sset thì mới cho revalidate

function bgRevalidate(key){
  // Nếu key này vừa được ghi gần đây (GAS chưa kịp đồng bộ), bỏ qua
  if(_recentWrites[key] && Date.now() - _recentWrites[key] < WRITE_GUARD_MS) return;
  if(_bgPending.has(key)) return;
  _bgPending.add(key);
  (async ()=>{
    try{
      const url = `${API_URL}?action=get&key=${encodeURIComponent(key)}&token=${encodeURIComponent(API_TOKEN)}`;
      const res = await fetch(url);
      const data = await res.json();
      if(data.error) return;
      const val = data.value ? JSON.parse(data.value) : null;
      const changed = JSON.stringify(val) !== JSON.stringify(_cache[key]);
      _cache[key] = val;
      lsSet(key, val);
      if(changed && !state.showLogin && !state.loading) render();
    } catch(e){} finally{ _bgPending.delete(key); }
  })();
}

// ── Session persistence (7 ngày) ──
const SESSION_TTL = 7 * 24 * 60 * 60 * 1000;
function sessionSave(){
  try{
    localStorage.setItem(LS_PFX+'session', JSON.stringify({
      unlocked: state.unlocked, tab: state.tab, isViewer: state.isViewer, t: Date.now()
    }));
  } catch(e){}
}
function sessionLoad(){
  try{
    const raw = localStorage.getItem(LS_PFX+'session');
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(Date.now() - s.t > SESSION_TTL) return null;
    return s;
  } catch(e){ return null; }
}
function sessionClear(){
  try{ localStorage.removeItem(LS_PFX+'session'); } catch(e){}
}

async function sget(key){
  if(key in _cache){
    // Nếu là dữ liệu động, revalidate ngầm để cập nhật sau
    if(isDynamicKey(key)) bgRevalidate(key);
    return _cache[key];
  }
  // Kiểm tra localStorage trước (tức thì, không cần network)
  const ls = lsGet(key);
  if(ls !== undefined){
    _cache[key] = ls;
    // Revalidate ngầm: fetch từ GAS, re-render nếu thay đổi
    if(isDynamicKey(key)) bgRevalidate(key);
    return ls;
  }
  try{
    const url = `${API_URL}?action=get&key=${encodeURIComponent(key)}&token=${encodeURIComponent(API_TOKEN)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const val = data.value ? JSON.parse(data.value) : null;
    _cache[key] = val;
    lsSet(key, val);
    return val;
  } catch(e){ console.error('sget failed', key, e); return null; }
}
async function sgetMany(keys){
  // Lấy từ cache/localStorage trước
  const missing = [];
  keys.forEach(k=>{
    if(k in _cache) return;
    const ls = lsGet(k);
    if(ls !== undefined){ _cache[k] = ls; } else { missing.push(k); }
  });
  if(missing.length > 0){
    try{
      const url = `${API_URL}?action=getMany&keys=${encodeURIComponent(JSON.stringify(missing))}&token=${encodeURIComponent(API_TOKEN)}`;
      const res = await fetch(url);
      const data = await res.json();
      if(data.values){
        Object.entries(data.values).forEach(([k,v])=>{
          const parsed = v ? JSON.parse(v) : null;
          _cache[k] = parsed;
          lsSet(k, parsed);
        });
      }
    } catch(e){ console.error('sgetMany failed', e); }
  }
  const result = {};
  keys.forEach(k => { result[k] = k in _cache ? _cache[k] : null; });
  return result;
}
async function sset(key, value){
  _cache[key] = value;
  _recentWrites[key] = Date.now(); // đánh dấu key này vừa được ghi
  lsSet(key, value); // lưu ngay vào localStorage
  try{
    const url = `${API_URL}?action=set&key=${encodeURIComponent(key)}&value=${encodeURIComponent(JSON.stringify(value))}&token=${encodeURIComponent(API_TOKEN)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return true;
  } catch(e){ console.error('sset failed', key, e); showToast('Lỗi lưu dữ liệu'); return false; }
}
async function doLogin(role, passcode){
  try{
    const url = `${API_URL}?action=login&role=${encodeURIComponent(role)}&passcode=${encodeURIComponent(passcode)}&token=${encodeURIComponent(API_TOKEN)}`;
    const res = await fetch(url);
    const data = await res.json();
    return !!data.ok;
  } catch(e){ return false; }
}

// Fetch 1 sheet: trả về {cols:[{label,type}], rows:[[]]}
async function fetchSheet(sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${SCORE_SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.replace(/^[^{]+/, '').replace(/\);?\s*$/, ''));
    if(!json.table) return null;
    const cols = json.table.cols.map(c => ({ label: c.label||'', type: c.type||'string' }));
    const rows = (json.table.rows||[]).map(r => r.c.map((c,ci) => {
      if(!c || c.v === null || c.v === undefined) return '';
      if(cols[ci] && cols[ci].type === 'date'){
        // date: prefer formatted string
        if(c.f) return c.f;
        const m = String(c.v).match(/Date\((\d+),(\d+),(\d+)\)/);
        if(m) return `${String(m[3]).padStart(2,'0')}/${String(Number(m[2])+1).padStart(2,'0')}/${m[1]}`;
      }
      return String(c.f || c.v);
    }));
    return { cols, rows };
  } catch(e){ return null; }
}

// Tra cứu học sinh theo Mã tra cứu (col D = index 3 trong DanhSach)
async function lookupStudentByCode(code){
  const data = await fetchSheet('DanhSach');
  if(!data) return null;
  const nc = code.replace(/\s/g,'');
  const row = data.rows.find(r => String(r[3]).replace(/\s/g,'') === nc);
  if(!row) return null;
  return { stt: row[0], name: row[1], dob: row[2], ma: row[3] };
}

// Fetch điểm + nhận xét tất cả môn
// Sheet điểm: col[2].type === 'number' → là điểm số, lookup by STT
// Sheet nhận xét: col[2].type === 'date' → là DanhSach-style, lookup by Mã (col[3])
async function fetchAllStudentData(stt, ma){
  const results = await Promise.all(SCORE_SUBJECTS.map(s => fetchSheet(s.name)));
  const scores = [], nhanXet = [];
  SCORE_SUBJECTS.forEach((subj, i) => {
    // Always push a score row for this subject, even if no data found
    const data = results[i];
    if(!data || !data.cols.length){
      scores.push({ subject:subj.name, icon:subj.icon, tx:[], gk:null, ck:null });
      return;
    }
    const isScoreSheet = data.cols[2] && data.cols[2].type === 'number';
    if(isScoreSheet){
      // Sheet điểm: tìm theo STT
      const row = data.rows.find(r => String(r[0]).trim() === String(stt).trim());
      if(!row){
        scores.push({ subject:subj.name, icon:subj.icon, tx:[], gk:null, ck:null });
        return;
      }
      const txVals = [row[2],row[3],row[4],row[5],row[6],row[7]].filter(v=>v!==''&&v!==null&&v!==undefined);
      scores.push({ subject:subj.name, icon:subj.icon, tx:txVals, gk:row[8]||null, ck:row[9]||null });
    } else {
      // Sheet nhận xét: tìm theo Mã (col[3])
      const row = data.rows.find(r => String(r[3]).replace(/\s/g,'') === String(ma).replace(/\s/g,''));
      if(row){
        for(let j=4; j<data.cols.length; j++){
          if(data.cols[j] && data.cols[j].label && row[j] && row[j].trim())
            nhanXet.push({ subject:subj.name, icon:subj.icon, label:data.cols[j].label, nd:row[j] });
        }
      }
    }
  });
  return { scores, nhanXet };
}

      }).join('');
      // (Nhận xét GVCN đã bị ẩn theo yêu cầu)

          </table>
        </div>

  const tagline = {
    'pick-type':'Bạn vào đây với tư cách gì?',
    'pick-viewer-type':'Chọn nội dung muốn xem',
    'pick-role':'Chọn vai trò của bạn',

    'enter-student-code':'Tra cứu điểm học tập',
    'show-scores':'',

  app.innerHTML = `
    <div class="login-splash">
      <div class="splash-blob"></div>

      <div class="splash-blob3"></div>

  const btnViewer = document.getElementById('btnIsViewer');
  if(btnViewer) btnViewer.onclick = ()=>{ loginStep='pick-viewer-type'; renderLoginScreen(); };
  // pick-viewer-type handlers
  const btnViewReport = document.getElementById('btnViewReport');
  if(btnViewReport) btnViewReport.onclick = ()=>{ state.showLogin=false; state.isViewer=true; state.tab='public'; sessionSave(); render(); };
  const btnViewScores = document.getElementById('btnViewScores');

  // Step 2 handlers
  app.querySelectorAll('[data-login-role]').forEach(btn=>{

      setTimeout(()=>{ const p=document.getElementById('splashPass'); if(p) p.focus(); }, 50);

  });

  // Back button
  const btnBack = document.getElementById('btnBack');
  if(btnBack) btnBack.onclick = ()=>{

    else if(loginStep==='enter-student-code') { loginStep='pick-viewer-type'; scoreData=null; }

  // Mã tra cứu lookup
  const codeSubmit = document.getElementById('codeSubmit');

      codeSubmit.disabled=false; codeSubmit.textContent='🔍 Tra cứu điểm';

    codeSubmit.disabled=false; codeSubmit.textContent='🔍 Tra cứu điểm';
    scoreData = { stt:student.stt, name:student.name, dob:student.dob, scores:allData.scores||[], nhanXet:allData.nhanXet||[] };

      state.tab = sel.tab;
      state.showLogin = false;

      loginStep = 'pick-type';

      render();

      errEl.textContent = 'Sai mật khẩu, thử lại.';
      document.getElementById('splashPass').value = '';
      document.getElementById('splashPass').focus();
    }
  };
  const passInput = document.getElementById('splashPass');
  if(passInput) passInput.onkeydown = e=>{ if(e.key==='Enter' && submitBtn) submitBtn.click(); };
}

function cover(title, sub, color, showDate){
  const dateBar = showDate ? `
    <div class="datebar">
      <input type="date" id="dateInput" value="${state.date}">
      <button class="today-btn" data-act="today">Hôm nay</button>
      <button class="today-btn" data-act="force-refresh" title="Làm mới dữ liệu" style="padding:7px 10px;">🔄</button>
    </div>` : '';
  return `<div class="cover" style="--role-color:${color}">
    <div class="cover-blob"></div>
    <div class="cover-blob2"></div>
    <p class="eyebrow">Sổ quản lý · Lớp 10B1</p>
    <h1>${title}</h1>
    <p class="sub">${sub}</p>
  </div>${dateBar}`;
}

function tabbar(){
  let entries;
  if(state.isViewer){
    entries = Object.entries(ROLE_META).filter(([k])=>PUBLIC_TABS.includes(k));
  } else {
    const isGVCN = state.unlocked['gvcn'];
    entries = Object.entries(ROLE_META).filter(([k])=>{
      if(k==='public'||k==='home') return false;
      if(isGVCN) return true; // GVCN thấy tất cả tab
      if(k==='lt')      return !!state.unlocked['lop-truong'];
      if(k==='hoctap')  return !!state.unlocked['hoc-tap'];
      if(k==='laodong') return !!state.unlocked['lao-dong'];
      if(k==='kyluat')  return !!(state.unlocked['to-1']||state.unlocked['to-2']||state.unlocked['to-3']);
      return false;
    });
  }
  const loginBtn = state.isViewer
    ? `<button data-act="go-login" style="flex:none;padding:10px 12px;border:none;background:none;font-family:inherit;font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.03em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;"><span style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;">🔑</span>Đăng nhập</button>`
    : `<button data-act="logout" title="Đăng xuất" style="flex:none;padding:10px 12px;border:none;background:none;font-family:inherit;font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.03em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;"><span style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;">🚪</span>Thoát</button>`;
  return `<div class="tabbar">${entries.map(([key,r])=>`
    <button data-tab="${key}" class="${state.tab===key?'active':''}" style="--role-color:${r.color}">
      <span class="ticon">${r.icon}</span>${r.short}
    </button>
  `).join('')}${loginBtn}</div>`;
}

function subtabs(group, items){
  const color = ROLE_META[state.tab].color;
  return `<div class="subtab">${items.map(([key,label])=>
    `<button data-subtab="${group}:${key}" class="${state.sub[group]===key?'active':''}" style="--role-color:${color}">${label}</button>`
  ).join('')}</div>`;
}

function lockBody(label, color, roleKey){
  return `<div class="lock-screen">
    <div class="lock-icon">🔐</div>
    <h3>${label}</h3>
    <p>Nhập mật khẩu được cấp để mở trang này.</p>
    <input type="password" id="passcodeInput" placeholder="Mật khẩu…">
    <button class="primary-btn" style="background:${color};color:#fff;" data-act="do-login" data-role="${roleKey}">Mở khoá →</button>
    <p id="loginError"></p>
  </div>`;
}

function emptyRoster(){ return '<p class="empty">Chưa có học sinh — vào tab Lớp để nhập danh sách.</p>'; }
function formatDateVN(ds){ const [y,m,d]=ds.split('-'); return `${d}/${m}/${y}`; }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

async function renderAsync(){
  const app = document.getElementById('app');
  const role = ROLE_META[state.tab];
  let coverHtml, mainHtml;

  if(state.tab === 'public'){
    coverHtml = cover('Báo cáo lớp 10B1', `Xem tự do · ${formatDateVN(state.date)}`, role.color, true);
    mainHtml = await renderPublic();
  } else if(state.tab === 'lt'){
    coverHtml = cover('Lớp trưởng', 'Điểm danh · Thu điện thoại · Kiểm tra hòm', role.color, true);
    mainHtml = await guarded('lop-truong', renderLT);
  } else if(state.tab === 'hoctap'){
    coverHtml = cover('LP Học tập', 'Truy bài đầu giờ 15 phút', role.color, true);
    mainHtml = await guarded('hoc-tap', renderHocTap);
  } else if(state.tab === 'laodong'){
    coverHtml = cover('LP Lao động', 'Phân công & kiểm tra trực nhật', role.color, true);
    mainHtml = await guarded('lao-dong', renderLaoDong);
  } else if(state.tab === 'kyluat'){
    coverHtml = cover('Kỷ luật', 'Điểm nền nếp theo tổ · điểm cộng & gậy 🥢', role.color, true);
    const subHtml = subtabs('kyluat', [['to-1','Tổ 1'],['to-2','Tổ 2'],['to-3','Tổ 3']]);
    if(!state.unlocked[state.sub.kyluat]){
      mainHtml = `<main>${subHtml}${lockBody('Tổ trưởng Tổ '+state.sub.kyluat.split('-')[1], role.color, state.sub.kyluat)}</main>`;
    } else {
      mainHtml = await renderKyLuat(subHtml);
    }
  } else if(state.tab === 'gvcn'){
    const gvSubLabels = {baocao:'Tổng hợp tình hình lớp', danhsach:`${state.roster.length} học sinh · Chỉ GVCN chỉnh sửa được`, phancong:'Ban cán sự lớp'};
    coverHtml = cover('GVCN', gvSubLabels[state.sub.gvcn] || '', role.color, state.sub.gvcn === 'baocao');
    mainHtml = await guarded('gvcn', renderGVCN);
  }

  app.innerHTML = coverHtml + mainHtml + tabbar();
  attachHandlers();
}

async function guarded(roleKey, renderFn){
  if(!state.unlocked[roleKey]) return `<main>${lockBody(ROLE_META[state.tab].label, ROLE_META[state.tab].color, roleKey)}</main>`;
  return await renderFn();
}

// ---------- PUBLIC VIEW ----------
async function renderPublic(){
  const _batch1 = await sgetMany([
    'attendance:'+state.date,
    'study:'+state.date,
    'discipline:log:'+state.month,
    'duty:'+state.date,
  ]);
  const attRaw = _batch1['attendance:'+state.date];
  const studyRaw = _batch1['study:'+state.date];
  const discLog = _batch1['discipline:log:'+state.month];
  const dutyRaw = _batch1['duty:'+state.date];
  const att = attRaw || {status:{}, phoneCount:0};
  const study = studyRaw || {status:{}};
  const duty = dutyRaw || null;
  const log = Array.isArray(discLog) ? discLog : [];

  // Điểm danh
  const present=[], late=[], absent=[];
  state.roster.forEach(s=>{
    const st = att.status[s.id]||'present';
    if(st==='present') present.push(s);
    else if(st==='late') late.push(s);
    else absent.push(s);
  });

async function computeWeekly(){
  const dates = [];
  const d = new Date(state.date+'T00:00:00');
  for(let i=0;i<7;i++){ const dd=new Date(d); dd.setDate(d.getDate()-i); dates.push(dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0')); }
  // 1 request duy nhất thay vì 7 request riêng lẻ
  const keys = dates.map(dt => 'study:'+dt);
  const fetched = await sgetMany(keys);
  const result = {};
  dates.forEach(dt=>{
    const rec = fetched['study:'+dt];
    if(!rec) return;
    for(const [sid, st] of Object.entries(rec.status||{})){
      if(!result[sid]) result[sid] = {partial:0, none:0, noequip:0};
      if(st==='partial') result[sid].partial++;
      if(st==='none') result[sid].none++;
      if(st==='noequip') result[sid].noequip++;
    }
  });
  return result;
}

function computeAssigned(dateStr){
  if(!ldConfig || ldConfig.order.length===0) return [];
  const start = new Date(ldConfig.startDate+'T00:00:00');
  const cur = new Date(dateStr+'T00:00:00');
  const dayIndex = Math.floor((cur-start)/86400000);
  const n = ldConfig.order.length;
  const size = Math.max(1, parseInt(ldConfig.groupSize)||1);
  const groups = Math.ceil(n/size);
  if(dayIndex < 0 || groups===0) return ldConfig.order.slice(0,size);
  const g = ((dayIndex % groups)+groups) % groups;
  return ldConfig.order.slice(g*size, g*size+size);
}

function monthOf(dateStr){ return dateStr.slice(0,7); }
function prevMonths(month, n){
  const [y,m] = month.split('-').map(Number);
  const arr=[];
  for(let i=0;i<n;i++){ let mm=m-i, yy=y; while(mm<=0){mm+=12; yy-=1;} arr.push(yy+'-'+String(mm).padStart(2,'0')); }
  return arr;
}
async function getMonthLog(month){ return await sget('discipline:log:'+month) || []; }
function aggregateLog(log){
  const agg = {};
  log.forEach(e=>{
    if(!agg[e.studentId]) agg[e.studentId] = {cong:0, gay:0};
    if(e.type==='cong') agg[e.studentId].cong += e.value; else agg[e.studentId].gay += e.value;
  });
  return agg;
}
function gayTier(total){

}

  if(total>=40) badges.push('Quà to + tuyên dương');

}

    wizardHtml = `<button class="primary-btn" data-act="open-wiz" style="background:var(--accent);margin-bottom:0;">+ Ghi nhận</button>`;
  } else {
    const STEP_LABELS = ['','Loại','Hành vi','Học sinh'];
    const curStep = dw.step === 'review' ? 3 : dw.step;
    const stepBar = [1,2,3].map(i=>`<div style="flex:1;padding:5px 0;text-align:center;font-size:11px;font-weight:700;background:${curStep>=i?'var(--accent)':'var(--card)'};color:${curStep>=i?'#fff':'var(--muted)'};">${i} ${STEP_LABELS[i]}</div>`).join('');

    let stepBody = '';
    if(dw.step === 1){
      stepBody = `<div style="display:flex;gap:10px;margin-top:6px;">
        <button data-wiz-type="vipham" style="flex:1;padding:18px 8px;border-radius:12px;border:2px solid var(--red);background:transparent;color:var(--red);font-size:22px;cursor:pointer;font-family:inherit;line-height:1.4;">🥢<br><span style="font-size:13px;font-weight:700;">Vi phạm</span></button>
        <button data-wiz-type="cong" style="flex:1;padding:18px 8px;border-radius:12px;border:2px solid var(--teal);background:transparent;color:var(--teal);font-size:22px;cursor:pointer;font-family:inherit;line-height:1.4;">⭐<br><span style="font-size:13px;font-weight:700;">Điểm cộng</span></button>
      </div>`;
    } else if(dw.step === 2){
      const isVP = dw.type==='vipham';
      const cats = isVP ? VIPHAM_CATEGORIES : CONG_CATEGORIES;
      const chips = cats.map(c=>{
        const val = isVP ? c.gay : c.pts;
        const isSel = dw.cats.has(c.label);
        return `<button class="disc-chip ${isVP?'vipham':'cong'}-chip${isSel?' active':''}" data-wiz-cat="${escapeAttr(c.label)}" data-wiz-catval="${val}">${escapeHtml(c.label)} ${isVP?val+'🥢':'+'+val+'đ'}</button>`;
      }).join('');
      stepBody = `<div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;">${chips}</div>
        ${dw.cats.size>0
          ? `<button class="primary-btn" data-wiz-next style="margin-top:2px;">Tiếp theo → <span style="font-weight:400;font-size:12px;">(${dw.cats.size} đã chọn)</span></button>`
          : `<p class="empty" style="margin:4px 0;font-size:12px;">Chọn ít nhất 1 hành vi</p>`}`;
    } else if(dw.step === 3){
      const stuChips = students.map(s=>{
        const isSel = dw.studs.has(s.id);
        return `<button class="stu-chip${isSel?' stu-chip-active':''}" data-wiz-stu="${s.id}">${escapeHtml(s.name)}</button>`;
      }).join('');
      stepBody = `<div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;">${stuChips}</div>
        ${dw.studs.size>0
          ? `<button class="primary-btn" data-wiz-review style="margin-top:2px;">Xem trước → <span style="font-weight:400;font-size:12px;">(${dw.studs.size} học sinh)</span></button>`
          : `<p class="empty" style="margin:4px 0;font-size:12px;">Chọn ít nhất 1 học sinh</p>`}`;
    } else if(dw.step === 'review'){
      const stuCount = new Set(dw.pairs.map(p=>p.sid)).size;
      const reviewRows = dw.pairs.map((p,i)=>{
        const isVP = p.type==='vipham';
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--border);">
          <span style="font-size:13px;"><b>${escapeHtml(p.name)}</b> — ${escapeHtml(p.cat)} <span style="color:${isVP?'var(--red)':'var(--teal)'};">${isVP?p.val+'🥢':'+'+p.val+'đ'}</span></span>
          <button data-wiz-remove="${i}" style="background:none;border:none;color:var(--bad);font-size:16px;cursor:pointer;padding:0 4px;flex-shrink:0;">×</button>
        </div>`;
      }).join('');
      stepBody = `<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Hệ thống sẽ tạo <b style="color:var(--text);">${dw.pairs.length} ghi nhận</b> cho <b style="color:var(--text);">${stuCount} học sinh</b></div>
        ${reviewRows}
        <button class="primary-btn" data-wiz-confirm style="margin-top:10px;background:var(--accent);">✓ Thêm vào danh sách chờ</button>`;
    }

    const showBack = dw.step !== 1;
    wizardHtml = `<div class="card" style="border:2px solid var(--accent);margin-bottom:0;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:13px;font-weight:700;">Ghi nhận nhanh</span>
        <div style="display:flex;gap:8px;align-items:center;">
          ${showBack?`<button data-wiz-back style="background:none;border:1px solid var(--border);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--muted);">← Quay</button>`:''}
          <button data-act="close-wiz" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);padding:0 2px;line-height:1;">✕</button>
        </div>
      </div>
      <div style="display:flex;border-radius:8px;overflow:hidden;margin-bottom:10px;">${stepBar}</div>
      ${stepBody}
    </div>`;
  }

  // ── Giỏ chờ (pending basket) ──
  let pendingHtml = '';
  if(discPending.length > 0){
    const rows = discPending.map((p,i)=>{
      const name = students.find(s=>s.id===p.studentId)?.name || '?';
      const isVP = p.type==='vipham';
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--border);">
        <span style="font-size:12px;">${escapeHtml(name)} — ${escapeHtml(p.category)} <span style="color:${isVP?'var(--red)':'var(--teal)'};">${isVP?p.value+'🥢':'+'+p.value+'đ'}</span></span>
        <button data-pend-remove="${i}" style="background:none;border:none;color:var(--bad);font-size:15px;cursor:pointer;padding:0 4px;flex-shrink:0;">×</button>
      </div>`;
    }).join('');
    pendingHtml = `<div class="card" style="margin-top:0;">
      <div style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-bottom:2px;">DANH SÁCH CHỜ — ${discPending.length} mục</div>
      ${rows}
    </div>
    <button class="primary-btn" data-act="submit-ticks" style="background:var(--accent);margin-bottom:4px;">✓ Lưu ${discPending.length} mục — ${formatDateVN(state.date)}</button>`;
  }

  // ── Nhật ký ──
  const recent = log.filter(e=> students.some(s=>s.id===e.studentId))
    .slice().sort((a,b)=>b.date>a.date?1:b.date<a.date?-1:0).slice(0,30).map(e=>{
    const name = state.roster.find(s=>s.id===e.studentId)?.name || '(đã xoá)';
    const isCong = e.type==='cong';
    return `<div class="disc-entry" data-disc-id="${e.id}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
        <span style="flex:1;"><b>${escapeHtml(name)}</b> — <span style="color:var(--muted);">${escapeHtml(e.category)}${e.note?(' · '+escapeHtml(e.note)):''}</span></span>
        <div style="display:flex;gap:6px;align-items:center;">
          <span class="disc-pts ${isCong?'pos':'neg'}">${isCong?'+'+e.value+'đ':e.value+' 🥢'}</span>
          ${isGVCN?`<button data-act="edit-disc" data-disc-id="${e.id}" data-disc-month="${monthOf(e.date)}" data-disc-value="${e.value}" data-disc-type="${e.type}" style="background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:0 2px;line-height:1;">✏️</button>`:''}
          ${isGVCN?`<button data-act="del-disc" data-disc-id="${e.id}" data-disc-month="${monthOf(e.date)}" style="background:none;border:none;color:var(--bad);font-size:15px;cursor:pointer;padding:0 2px;line-height:1;">×</button>`:''}
        </div>
      </div>
      <div class="week-sub">${formatDateVN(e.date)}</div>
    </div>`;
  }).join('');

  return `<main>${subHtml}
    <h2 class="section">📋 Tổ ${toNum} — ${formatDateVN(state.date)}</h2>
    ${wizardHtml}
    ${pendingHtml}
    <div class="card">${stuRows || '<p class="empty">Không có học sinh.</p>'}</div>
    <h2 class="section">Nhật ký tháng <input type="month" id="monthInput" value="${state.month}"></h2>
    <div class="card">${recent || '<p class="empty">Chưa có ghi nhận nào.</p>'}</div>
  </main>`;
}

async function renderGVCN(){
  const gvSubTabs = subtabs('gvcn', [['baocao','Báo cáo ngày'],['danhsach','Danh sách lớp'],['phancong','Phân công']]);

  // ── Subtab: Danh sách lớp ──
  if(state.sub.gvcn === 'danhsach'){
    const rows = state.roster.map((s,i)=>`
      <div class="roster-edit-row" data-id="${s.id}">
        <span class="idx">${i+1}</span>
        <input type="text" class="rname" value="${escapeAttr(s.name)}" placeholder="Họ và tên">
        <select class="select-to" data-id="${s.id}">
          <option value="" ${!s.to?'selected':''}>Tổ?</option>
          <option value="1" ${s.to===1?'selected':''}>Tổ 1</option>
          <option value="2" ${s.to===2?'selected':''}>Tổ 2</option>
          <option value="3" ${s.to===3?'selected':''}>Tổ 3</option>
        </select>
        <button class="rm-btn" data-act="rm-student" data-id="${s.id}">✕</button>
      </div>`).join('');
    return `<main>
      ${gvSubTabs}
      <h2 class="section">Học sinh (${state.roster.length})</h2>
      <div class="card">
        ${rows || '<p class="empty">Chưa có học sinh nào.</p>'}
        <button class="add-btn" data-act="add-student">+ Thêm học sinh</button>
      </div>
      <button class="primary-btn" data-act="save-roster">Lưu danh sách</button>
      <p style="text-align:center;font-size:12px;color:var(--muted);margin-top:10px;">Chọn Tổ để tổ trưởng chỉ thấy tổ mình.</p>
    </main>`;
  }

  // ── Subtab: Phân công ──
  if(state.sub.gvcn === 'phancong'){
    const assign = await sget('assignments') || {};
    const rows = ASSIGNMENT_FIELDS.map(f=>`
      <div class="card" style="margin-bottom:8px;">
        <div class="week-name">${f.title}</div>
        <div class="week-sub" style="margin-bottom:8px;">${f.desc}</div>
        <input type="text" class="note-input assign-input" data-key="${f.key}" value="${escapeAttr(assign[f.key]||'')}" placeholder="Tên bạn phụ trách..." style="margin-top:0;">
      </div>`).join('');
    return `<main>
      ${gvSubTabs}
      <h2 class="section">Phân công ban cán sự</h2>
      ${rows}
      <button class="primary-btn" data-act="save-assignments">Lưu phân công</button>
    </main>`;
  }

  // ── Subtab: Báo cáo ngày (default) ──
  const months3 = prevMonths(state.month, 3);
  const _batchKeys = [
    'attendance:'+state.date,
    'study:'+state.date,
    'duty:'+state.date,
    'assignments',
    ...months3.map(m=>'discipline:log:'+m),
  ];
  const _batchG = await sgetMany(_batchKeys);
  const attRaw = _batchG['attendance:'+state.date];
  const studyRaw = _batchG['study:'+state.date];
  const dutyRaw = _batchG['duty:'+state.date];
  const assign = _batchG['assignments'];
  const logsByMonth = months3.map(m=> { const v = _batchG['discipline:log:'+m]; return Array.isArray(v)?v:[]; });
  const att = attRaw || {status:{}, phoneCount:0, openedBox:false, closedBox:false};
  const lateList=[], absentList=[];
  state.roster.forEach(s=>{ const st=att.status[s.id]||'present'; if(st==='late') lateList.push(s.name); else if(st==='absent') absentList.push(s.name); });
  const study = studyRaw || {status:{}, remind:false};
  const issueList = state.roster.filter(s=> ['partial','none','noequip'].includes(study.status[s.id])).map(s=>({name:s.name, st:study.status[s.id]}));
  const duty = dutyRaw || null;
  const dutyNames = duty ? duty.assigned.map(id=>state.roster.find(s=>s.id===id)?.name||'?') : [];
  const aggByMonth = logsByMonth.map(aggregateLog);
  const agg = aggByMonth[0];
  const rawLog = logsByMonth[0] || [];

  const disciplineRows = [1,2,3].map(toNum=>{
    const students = state.roster.filter(s=>s.to===toNum);
    const rows = students.map(s=>{
      const a = agg[s.id]||{cong:0,gay:0};
      const tier = gayTier(a.gay);
      const badges = quyenLoiTier(a.cong);
      const chronic = months3.every((m,i)=> (aggByMonth[i][s.id]?.gay||0) >=3 );
      const isGVCN = state.unlocked['gvcn'];
      const entries = rawLog.filter(e=>e.studentId===s.id).slice().sort((a,b)=>b.date>a.date?1:-1);
      const entriesHtml = entries.length ? entries.map(e=>{
        const isCong = e.type==='cong';
        return `<div style="display:flex;justify-content:space-between;gap:6px;align-items:center;padding:3px 0;border-top:1px solid var(--border);">
          <span style="font-size:12px;color:var(--muted);flex:1;">${escapeHtml(e.category)}${e.note?' · '+escapeHtml(e.note):''} <span style="color:var(--info);font-size:11px;">(${e.date.slice(8)}/${e.date.slice(5,7)})</span></span>
          <div style="display:flex;gap:4px;align-items:center;">
            <span style="font-size:12px;font-weight:700;color:${isCong?'var(--teal)':'var(--red)'};">${isCong?'+'+e.value+'đ':e.value+'🥢'}</span>
            ${isGVCN ? `<button data-act="edit-disc" data-disc-id="${e.id}" data-disc-month="${monthOf(e.date)}" data-disc-value="${e.value}" data-disc-type="${e.type}" style="background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:0 2px;line-height:1;">✏️</button>` : ''}
            ${isGVCN ? `<button data-act="del-disc" data-disc-id="${e.id}" data-disc-month="${monthOf(e.date)}" style="background:none;border:none;color:var(--bad);font-size:15px;cursor:pointer;padding:0 2px;line-height:1;">×</button>` : ''}
          </div>
        </div>`;
      }).join('') : '';
      return `<div style="padding:6px 0 2px;">
        <div class="row" style="padding-bottom:${entries.length?'4px':'0'};">
          <span class="name">${escapeHtml(s.name)}</span>
          <span style="font-size:12px;color:var(--muted);"><span style="color:var(--teal);">+${a.cong}đ</span> · <span style="color:var(--red);">${a.gay}🥢</span>${tier?' · '+tier.label:''}${chronic?' · <b style="color:var(--red);">Cân nhắc HK</b>':''}${badges.length?' · 🎁 '+badges.join(', '):''}</span>
        </div>
        ${entriesHtml}
      </div>`;
    }).join('<hr style="border:none;border-top:1px solid var(--border);margin:2px 0;">');
    return `<h2 class="section">Tổ ${toNum}</h2><div class="card">${rows || emptyRoster()}</div>`;
  }).join('');

  const assignSafe = assign || {};
  const assignRows = ASSIGNMENT_FIELDS.map(f=>`<div class="row"><span class="name">${f.title}</span><span class="week-sub">${escapeHtml(assignSafe[f.key]||'(chưa có)')}</span></div>`).join('');

  return `<main>
    ${gvSubTabs}
    <h2 class="section">Điểm danh ${formatDateVN(state.date)}</h2>
    <div class="card">
      <div class="week-sub">🚫 Vắng: ${absentList.join(', ')||'không có'}</div>
      <div class="week-sub">⏰ Muộn: ${lateList.join(', ')||'không có'}</div>
      <div class="week-sub">📱 Thu ĐT: ${att.phoneCount}/${state.roster.length} · Hòm: ${att.openedBox?'đã mở':'chưa mở'} / ${att.closedBox?'đã dọn':'chưa dọn'}</div>
    </div>
    <h2 class="section">Truy bài hôm nay</h2>
    <div class="card">
      ${issueList.length ? issueList.map(x=>`<div class="week-sub">${escapeHtml(x.name)} — ${x.st==='partial'?'thiếu bài':x.st==='none'?'không làm bài':'thiếu dụng cụ'}</div>`).join('') : '<p class="empty">Không có vấn đề gì hôm nay ✓</p>'}
      <div class="week-sub" style="margin-top:6px;">Đã nhắc BTVN: ${study.remind?'✓':'chưa'}</div>
    </div>
    <h2 class="section">Trực nhật hôm nay</h2>
    <div class="card">
      <div class="week-sub">${dutyNames.join(', ')||'chưa phân công'}</div>
      <div class="week-sub">Kiểm tra: ${duty && duty.checked==='pass'?'✓ Đạt':duty && duty.checked==='fail'?'✗ Chưa đạt':'chưa kiểm tra'}${duty && duty.note?(' — '+escapeHtml(duty.note)):''}</div>
    </div>
    <h2 class="section">Nền nếp tháng <input type="month" id="monthInput" value="${state.month}"></h2>
    ${disciplineRows}
    <h2 class="section">Phân công nhiệm vụ</h2>
    <div class="card">${assignRows}</div>
    <h2 class="section">Xuất dữ liệu</h2>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button class="primary-btn" data-act="csv-att" style="background:var(--surf2);color:var(--text);border:1px solid var(--border);">📥 Xuất điểm danh tháng này (.csv)</button>
      <button class="primary-btn" data-act="csv-study" style="background:var(--surf2);color:var(--text);border:1px solid var(--border);">📥 Xuất học tập tháng này (.csv)</button>
      <button class="primary-btn" data-act="csv-disc" style="background:var(--surf2);color:var(--text);border:1px solid var(--border);">📥 Xuất nền nếp tháng này (.csv)</button>
    </div>
  </main>`;
}

async function submitTicksHandler(){
  if(!discPending.length) return;
  const entries = discPending.map(p=>({id:uid(), studentId:p.studentId, type:p.type, category:p.category, value:p.value, note:'', date:state.date}));
  const entryMonth = monthOf(state.date);
  const log = await getMonthLog(entryMonth);
  const newLog = [...log, ...entries];
  await sset('discipline:log:'+entryMonth, newLog);
  discPending = [];
  discWizard = {open:false, step:1, type:null, cats:new Set(), studs:new Set(), pairs:[]};
  showToast(`✓ Đã ghi nhận ${entries.length} mục cho ${formatDateVN(state.date)}`);
  renderAsync();
}

function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-tab]').forEach(btn=>{ btn.onclick = ()=>{ state.tab = btn.dataset.tab; render(); }; });
  const goLoginBtn = app.querySelector('[data-act="go-login"]');
  if(goLoginBtn) goLoginBtn.onclick = ()=>{ state.showLogin = true; state.isViewer = false; state.loginSelectedRole = null; loginStep='pick-type'; render(); };
  const logoutBtn = app.querySelector('[data-act="logout"]');
  if(logoutBtn) logoutBtn.onclick = ()=>{
    if(!confirm('Đăng xuất và quay về màn hình chọn vai trò?')) return;
    state.unlocked = {}; state.showLogin = true; state.isViewer = false; state.loginSelectedRole = null; loginStep='pick-type';
    sessionClear();
    render();
  };
  app.querySelectorAll('[data-subtab]').forEach(btn=>{
    btn.onclick = ()=>{
      const [group,key] = btn.dataset.subtab.split(':');
      state.sub[group] = key;
      if(group==='kyluat'){ disciplineForm = {type:'cong', studentId:'', category:''}; }
      renderAsync();
    };
  });
  const dateInput = document.getElementById('dateInput');
  if(dateInput) dateInput.onchange = ()=>{ state.date = dateInput.value; discPending=[]; discWizard={open:false,step:1,type:null,cats:new Set(),studs:new Set(),pairs:[]}; renderAsync(); };
  const todayBtn = app.querySelector('[data-act="today"]');
  if(todayBtn) todayBtn.onclick = ()=>{ state.date = todayStr(); renderAsync(); };
  const refreshBtn = app.querySelector('[data-act="force-refresh"]');
  if(refreshBtn) refreshBtn.onclick = ()=>{
    // Chỉ xoá localStorage (không xoá _cache — để dữ liệu vừa lưu không bị mất)
    // Key nào KHÔNG vừa được ghi thì mới xoá _cache để force fetch từ GAS
    const d = state.date, m = state.month;
    ['attendance:'+d,'study:'+d,'duty:'+d,'discipline:log:'+m].forEach(k=>{
      try{ localStorage.removeItem(LS_PFX+k); } catch(e){}
      // Chỉ xoá in-memory cache nếu key không vừa được ghi gần đây
      if(!_recentWrites[k] || Date.now() - _recentWrites[k] >= WRITE_GUARD_MS){
        delete _cache[k];
      }
    });
    ltLoadedDate = null; htLoadedDate = null; ldLoadedDate = null;
    showToast('Đang làm mới…');
    renderAsync();
  };
  // (no theme toggle)
  const monthInput = document.getElementById('monthInput');
  if(monthInput) monthInput.onchange = ()=>{ state.month = monthInput.value; renderAsync(); };

  const loginBtn = app.querySelector('[data-act="do-login"]');
  if(loginBtn) loginBtn.onclick = async ()=>{
    const val = document.getElementById('passcodeInput').value;
    const role = loginBtn.dataset.role;
    const ok = await doLogin(role, val);
    if(ok){ state.unlocked[role] = true; renderAsync(); }
    else { document.getElementById('loginError').textContent = 'Sai mật khẩu, thử lại.'; }
  };

  const addStudentBtn = app.querySelector('[data-act="add-student"]');
  if(addStudentBtn) addStudentBtn.onclick = ()=>{
    state.roster.push({id:uid(), name:'', to:null});
    render();
    const inputs = app.querySelectorAll('.rname');
    if(inputs.length) inputs[inputs.length-1].focus();
  };
  app.querySelectorAll('[data-act="rm-student"]').forEach(btn=>{ btn.onclick = ()=>{ state.roster = state.roster.filter(s=>s.id!==btn.dataset.id); render(); }; });
  app.querySelectorAll('.rname').forEach((inp,i)=>{ inp.oninput = ()=>{ state.roster[i].name = inp.value; }; });
  app.querySelectorAll('.select-to').forEach(sel=>{
    sel.onchange = ()=>{ const s = state.roster.find(x=>x.id===sel.dataset.id); if(s) s.to = sel.value ? parseInt(sel.value) : null; };
  });
  const saveRosterBtn = app.querySelector('[data-act="save-roster"]');
  if(saveRosterBtn) saveRosterBtn.onclick = async ()=>{
    state.roster = state.roster.filter(s=>s.name.trim()!=='');
    await saveRoster();
    showToast('✓ Đã lưu danh sách lớp');
    render();
  };
  const saveAssignBtn = app.querySelector('[data-act="save-assignments"]');
  if(saveAssignBtn) saveAssignBtn.onclick = async ()=>{
    const obj = {};
    app.querySelectorAll('.assign-input').forEach(inp=>{ obj[inp.dataset.key] = inp.value; });
    await sset('assignments', obj);
    showToast('✓ Đã lưu phân công');
  };

  app.querySelectorAll('[data-group="att"]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{
        ltData.status[seg.dataset.id] = btn.dataset.val;
        // Reset permission khi trở về đúng giờ
        if(btn.dataset.val === 'present'){
          if(ltData.permission) delete ltData.permission[seg.dataset.id];
        }
        renderAsync(); sset('attendance:'+state.date, ltData);
      };
    });
  });
  app.querySelectorAll('[data-group="perm"]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{
        if(!ltData.permission) ltData.permission = {};
        ltData.permission[seg.dataset.id] = btn.dataset.val;
        renderAsync(); sset('attendance:'+state.date, ltData);
      };
    });
  });
  const phoneInc = app.querySelector('[data-act="phone-inc"]');
  const phoneDec = app.querySelector('[data-act="phone-dec"]');
  if(phoneInc) phoneInc.onclick = ()=>{ ltData.phoneCount = Math.min(state.roster.length, (ltData.phoneCount||0)+1); renderAsync(); sset('attendance:'+state.date, ltData); };
  if(phoneDec) phoneDec.onclick = ()=>{ ltData.phoneCount = Math.max(0, (ltData.phoneCount||0)-1); renderAsync(); sset('attendance:'+state.date, ltData); };
  const chkOpen = app.querySelector('[data-act="chk-open"]');
  if(chkOpen) chkOpen.onchange = ()=>{ ltData.openedBox = chkOpen.checked; sset('attendance:'+state.date, ltData); };
  const chkClose = app.querySelector('[data-act="chk-close"]');
  if(chkClose) chkClose.onchange = ()=>{ ltData.closedBox = chkClose.checked; sset('attendance:'+state.date, ltData); };

  app.querySelectorAll('[data-group="study"]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{ htData.status[seg.dataset.id] = btn.dataset.val; renderAsync(); sset('study:'+state.date, htData); };
    });
  });
  const chkRemind = app.querySelector('[data-act="chk-remind"]');
  if(chkRemind) chkRemind.onchange = ()=>{ htData.remind = chkRemind.checked; sset('study:'+state.date, htData); };

  app.querySelectorAll('[data-act="toggle-duty"]').forEach(chk=>{
    chk.onchange = ()=>{
      const id = chk.dataset.id;
      const idx = ldDayData.assigned.indexOf(id);
      if(idx>=0) ldDayData.assigned.splice(idx,1); else ldDayData.assigned.push(id);
      sset('duty:'+state.date, ldDayData);
    };
  });
  app.querySelectorAll('[data-group="duty-check"] button').forEach(btn=>{
    btn.onclick = ()=>{ ldDayData.checked = btn.dataset.val; renderAsync(); sset('duty:'+state.date, ldDayData); };
  });
  const saveDutyNoteBtn = app.querySelector('[data-act="save-duty-note"]');
  if(saveDutyNoteBtn) saveDutyNoteBtn.onclick = async ()=>{
    ldDayData.note = document.getElementById('dutyNote').value;
    await sset('duty:'+state.date, ldDayData);
    showToast('✓ Đã lưu nhận xét trực nhật');
  };
  // Upcoming duty — save per-day overrides
  app.querySelectorAll('.save-upcoming-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const ds = btn.dataset.date;
      const sel = app.querySelector(`.upcoming-duty-sel[data-date="${ds}"]`);
      const chosen = sel && sel.value ? [sel.value] : [];
      const existing = await sget('duty:'+ds) || {};
      await sset('duty:'+ds, {...existing, assigned: chosen});
      btn.textContent = '✓'; btn.style.background = 'var(--ok)';
      setTimeout(()=>{ btn.textContent = 'Lưu'; btn.style.background = 'var(--warn)'; }, 1200);
      // Invalidate today's cache if date matches
      if(ds === state.date) ldLoadedDate = null;
    };
  });
  const saveDutyConfigBtn = app.querySelector('[data-act="save-duty-config"]');
  if(saveDutyConfigBtn) saveDutyConfigBtn.onclick = async ()=>{
    ldConfig.groupSize = Math.max(1, parseInt(document.getElementById('groupSizeInput').value)||1);
    ldConfig.startDate = document.getElementById('startDateInput').value || state.date;
    await sset('duty:config', ldConfig);
    showToast('✓ Đã lưu cài đặt');
    renderAsync();
  };

  // ── Wizard handlers ──
  const openWizBtn = app.querySelector('[data-act="open-wiz"]');
  if(openWizBtn) openWizBtn.onclick = ()=>{ discWizard={open:true,step:1,type:null,cats:new Set(),studs:new Set(),pairs:[]}; renderAsync(); };
  const closeWizBtn = app.querySelector('[data-act="close-wiz"]');
  if(closeWizBtn) closeWizBtn.onclick = ()=>{ discWizard.open=false; renderAsync(); };
  // Bước 1: chọn loại
  app.querySelectorAll('[data-wiz-type]').forEach(btn=>{
    btn.onclick = ()=>{ discWizard.type=btn.dataset.wizType; discWizard.step=2; renderAsync(); };
  });
  // Bước 2: toggle hành vi
  app.querySelectorAll('[data-wiz-cat]').forEach(btn=>{
    btn.onclick = ()=>{
      const cat = btn.dataset.wizCat;
      if(discWizard.cats.has(cat)) discWizard.cats.delete(cat); else discWizard.cats.add(cat);
      renderAsync();
    };
  });
  const wizNextBtn = app.querySelector('[data-wiz-next]');
  if(wizNextBtn) wizNextBtn.onclick = ()=>{ discWizard.step=3; renderAsync(); };
  // Bước 3: toggle học sinh
  app.querySelectorAll('[data-wiz-stu]').forEach(btn=>{
    btn.onclick = ()=>{
      const sid = btn.dataset.wizStu;
      if(discWizard.studs.has(sid)) discWizard.studs.delete(sid); else discWizard.studs.add(sid);
      renderAsync();
    };
  });
  // Chuyển sang review: tạo danh sách pairs
  const wizReviewBtn = app.querySelector('[data-wiz-review]');
  if(wizReviewBtn) wizReviewBtn.onclick = ()=>{
    const toNum2 = parseInt(state.sub.kyluat.split('-')[1]);
    const stus = state.roster.filter(s=>s.to===toNum2);
    const pairs = [];
    discWizard.studs.forEach(sid=>{
      const name = stus.find(s=>s.id===sid)?.name||'?';
      discWizard.cats.forEach(cat=>{
        const isVP = discWizard.type==='vipham';
        const catObj = isVP ? VIPHAM_CATEGORIES.find(c=>c.label===cat) : CONG_CATEGORIES.find(c=>c.label===cat);
        const val = isVP ? catObj?.gay : catObj?.pts;
        pairs.push({sid, name, type:discWizard.type, cat, val});
      });
    });
    discWizard.pairs = pairs;
    discWizard.step = 'review';
    renderAsync();
  };
  // Review: xóa 1 cặp
  app.querySelectorAll('[data-wiz-remove]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.wizRemove);
      discWizard.pairs.splice(idx,1);
      if(!discWizard.pairs.length) discWizard.step=3;
      renderAsync();
    };
  });
  // Confirm: thêm vào pending, reset wizard về bước 1
  const wizConfirmBtn = app.querySelector('[data-wiz-confirm]');
  if(wizConfirmBtn) wizConfirmBtn.onclick = ()=>{
    discWizard.pairs.forEach(p=>{ discPending.push({studentId:p.sid, type:p.type, category:p.cat, value:p.val}); });
    discWizard = {open:true, step:1, type:null, cats:new Set(), studs:new Set(), pairs:[]};
    renderAsync();
  };
  // Quay lại
  const wizBackBtn = app.querySelector('[data-wiz-back]');
  if(wizBackBtn) wizBackBtn.onclick = ()=>{
    if(discWizard.step==='review') discWizard.step=3;
    else if(typeof discWizard.step==='number' && discWizard.step>1) discWizard.step--;
    renderAsync();
  };
  // Xóa 1 mục trong pending
  app.querySelectorAll('[data-pend-remove]').forEach(btn=>{
    btn.onclick = ()=>{ discPending.splice(parseInt(btn.dataset.pendRemove),1); renderAsync(); };
  });
  // Submit tất cả
  const existingSubBtn = app.querySelector('[data-act="submit-ticks"]');
  if(existingSubBtn) existingSubBtn.onclick = submitTicksHandler;

  const csvAtt = app.querySelector('[data-act="csv-att"]');
  if(csvAtt) csvAtt.onclick = exportAttendanceCSV;
  const csvStudy = app.querySelector('[data-act="csv-study"]');
  if(csvStudy) csvStudy.onclick = exportStudyCSV;
  const csvDisc = app.querySelector('[data-act="csv-disc"]');
  if(csvDisc) csvDisc.onclick = exportDisciplineCSV;

  app.querySelectorAll('[data-act="edit-disc"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.discId;
      const month = btn.dataset.discMonth;
      const oldVal = btn.dataset.discValue;
      const type = btn.dataset.discType;
      const unit = type === 'cong' ? 'điểm cộng' : 'gậy';
      const newVal = prompt(`Sửa số ${unit} (hiện tại: ${oldVal}):`, oldVal);
      if(newVal === null) return;
      const parsed = parseInt(newVal);
      if(isNaN(parsed) || parsed <= 0){ showToast('Số không hợp lệ'); return; }
      const log = await getMonthLog(month);
      const entry = log.find(e=>e.id===id);
      if(entry){ entry.value = parsed; }
      await sset('discipline:log:'+month, log);
      showToast('✓ Đã sửa');
      renderAsync();
    };
  });

  app.querySelectorAll('[data-act="del-disc"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.discId;
      const month = btn.dataset.discMonth;
      if(!confirm('Xoá ghi nhận này?')) return;
      const log = await getMonthLog(month);
      const updated = log.filter(e=>e.id !== id);
      await sset('discipline:log:'+month, updated);
      showToast('✓ Đã xoá');
      renderAsync();
    };
  });
}

init();
</script>
</body>
</html>
