<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lớp 10B1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────────────── */
:root {
  --bg:       #EDE7DD;
  --surf:     #F8F3ED;
  --surf2:    #E5DDD3;
  --border:   rgba(100,65,30,.14);
  --text:     #27190E;
  --muted:    #7A6655;
  --accent:   #8B5E34;
  --ok:       #3D7A5A;
  --warn:     #9A7620;
  --bad:      #A83232;
  --info:     #426C8C;
  --ok-bg:    rgba(61,122,90,.10);
  --warn-bg:  rgba(154,118,32,.10);
  --bad-bg:   rgba(168,50,50,.10);
  --radius:   14px;
  --radius-sm:8px;
  --sh:       0 2px 12px rgba(60,30,10,.09);
  --sh-md:    0 4px 20px rgba(60,30,10,.12);
  --role-color: var(--accent);
  --font: 'Be Vietnam Pro', system-ui, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:     #1A1208;
    --surf:   #261A0E;
    --surf2:  #30200F;
    --border: rgba(180,130,70,.16);
    --text:   #EEE2D0;
    --muted:  #9A8268;
    --accent: #C48A52;
    --ok:     #5DAA7C;
    --warn:   #C49A30;
    --bad:    #D15555;
    --info:   #5B9CC8;
    --ok-bg:  rgba(93,170,124,.12);
    --warn-bg:rgba(196,154,48,.12);
    --bad-bg: rgba(209,85,85,.12);
    --sh:     0 2px 12px rgba(0,0,0,.3);
    --sh-md:  0 4px 20px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg:     #1A1208;
  --surf:   #261A0E;
  --surf2:  #30200F;
  --border: rgba(180,130,70,.16);
  --text:   #EEE2D0;
  --muted:  #9A8268;
  --accent: #C48A52;
  --ok:     #5DAA7C;
  --warn:   #C49A30;
  --bad:    #D15555;
  --info:   #5B9CC8;
  --ok-bg:  rgba(93,170,124,.12);
  --warn-bg:rgba(196,154,48,.12);
  --bad-bg: rgba(209,85,85,.12);
  --sh:     0 2px 12px rgba(0,0,0,.3);
  --sh-md:  0 4px 20px rgba(0,0,0,.4);
}

/* ── RESET ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  margin:0; font-family:var(--font);
  background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
input, button, select, textarea { font-family:var(--font); }
a { color:var(--accent); }

/* ── LAYOUT ─────────────────────────────────────────────────── */
#app { max-width:480px; margin:0 auto; padding-bottom:90px; min-height:100vh; }
main { padding:0 14px 16px; }

/* ── HEADER / COVER ─────────────────────────────────────────── */
.cover {
  padding:48px 18px 18px; position:relative;
  background:var(--surf); overflow:hidden;
  border-bottom:1px solid var(--border);
}
.cover::after {
  content:''; position:absolute; top:-60px; right:-50px;
  width:160px; height:160px; border-radius:50%;
  background:var(--role-color); opacity:.10; pointer-events:none;
}
.cover .eyebrow {
  font-size:10px; letter-spacing:.14em; font-weight:700;
  color:var(--accent); text-transform:uppercase; margin:0 0 6px;
  display:flex; align-items:center; gap:6px;
}
.cover h1 { margin:0; font-size:24px; font-weight:800; line-height:1.2; }
.cover .sub { margin:4px 0 0; font-size:12px; color:var(--muted); }

/* ── CONN DOT ───────────────────────────────────────────────── */
.conn-dot {
  width:7px; height:7px; border-radius:50%;
  background:var(--muted); display:inline-block; flex-shrink:0;
  transition:background .3s;
}
.conn-dot.ok  { background:var(--ok); }
.conn-dot.bad { background:var(--bad); }
.conn-dot.spin { animation:pulse 1s infinite; background:var(--warn); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── DATE BAR ───────────────────────────────────────────────── */
.datebar {
  display:flex; align-items:center; gap:8px;
  padding:8px 14px; background:var(--surf);
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20; backdrop-filter:blur(12px);
}
.datebar input[type=date], .datebar input[type=month] {
  flex:1; font-family:var(--font); font-size:13px; font-weight:500;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:7px 10px; background:var(--surf2); color:var(--text);
  min-width:0;
}
.datebar input[type=date]::-webkit-calendar-picker-indicator,
.datebar input[type=month]::-webkit-calendar-picker-indicator { opacity:.5; }
.today-btn {
  font-size:12px; font-weight:600; white-space:nowrap;
  background:var(--surf2); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:7px 11px; color:var(--muted);
  cursor:pointer;
}

/* ── SECTION LABELS ─────────────────────────────────────────── */
h2.sec {
  font-size:10px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted);
  margin:20px 0 8px; display:flex; align-items:center; gap:8px;
}
h2.sec input[type=month] {
  font-family:var(--font); font-size:11px; letter-spacing:0;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:3px 7px; background:var(--surf2); color:var(--text);
}

/* ── CARDS ──────────────────────────────────────────────────── */
.card {
  background:var(--surf); border-radius:var(--radius);
  padding:14px; margin-bottom:10px; box-shadow:var(--sh);
  border:1px solid var(--border);
}
.card + .card { }

/* ── ROWS ───────────────────────────────────────────────────── */
.row {
  display:flex; align-items:center; gap:10px; padding:10px 0;
  flex-wrap:wrap;
}
.row + .row { border-top:1px solid var(--border); }
.idx { width:20px; font-size:11px; color:var(--muted); font-weight:700; text-align:right; flex-shrink:0; }
.name { flex:1; font-size:14px; font-weight:500; min-width:0; }
.name.full-w { flex-basis:100%; }

/* ── STAT PILLS ─────────────────────────────────────────────── */
.stat-strip { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
.pill {
  background:var(--surf); border-radius:999px; padding:5px 13px;
  font-size:12px; color:var(--muted); box-shadow:var(--sh);
  border:1px solid var(--border);
}
.pill b { color:var(--text); font-weight:700; }

/* ── SEGMENTED CONTROL ──────────────────────────────────────── */
.seg {
  display:flex; background:var(--surf2); border-radius:var(--radius-sm);
  overflow:hidden; border:1px solid var(--border);
}
.seg button {
  flex:1; border:none; background:none; padding:8px 9px;
  font-size:12px; font-family:var(--font); font-weight:600;
  color:var(--muted); cursor:pointer; transition:background .12s,color .12s;
  white-space:nowrap;
}
.seg button + button { border-left:1px solid var(--border); }
.seg button.on-ok   { background:var(--ok);   color:#fff; }
.seg button.on-warn { background:var(--warn);  color:#fff; }
.seg button.on-bad  { background:var(--bad);   color:#fff; }
.seg button.on-info { background:var(--info);  color:#fff; }
.seg.seg4 button { font-size:11px; padding:8px 4px; }

/* ── INPUTS ─────────────────────────────────────────────────── */
.field-input, .note-input, select.sel {
  width:100%; font-family:var(--font); font-size:13px; font-weight:500;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:10px 12px; background:var(--surf2); color:var(--text);
  margin-top:0; -webkit-appearance:none;
}
.field-input::placeholder, .note-input::placeholder { color:var(--muted); font-weight:400; }
textarea.note-input { resize:vertical; min-height:64px; }
label.lbl {
  display:block; font-size:10px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); margin:12px 0 5px;
}
label.lbl:first-child { margin-top:0; }

/* ── BUTTONS ─────────────────────────────────────────────────── */
.btn-primary, .btn-ghost, .btn-add {
  width:100%; padding:13px; border-radius:var(--radius); border:none;
  font-family:var(--font); font-weight:700; font-size:14px;
  margin-top:10px; cursor:pointer; transition:opacity .15s, transform .1s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-primary:active, .btn-ghost:active, .btn-add:active { transform:scale(.98); }
.btn-primary { background:var(--role-color); color:#fff; }
.btn-ghost { background:var(--surf2); color:var(--muted); border:1.5px dashed var(--border); margin-top:8px; }
.btn-add { background:var(--surf2); color:var(--muted); border:1.5px dashed var(--border); margin-top:6px; padding:11px; }
.btn-primary.saving { opacity:.65; pointer-events:none; }

/* ── SAVE BANNER ─────────────────────────────────────────────── */
.save-banner {
  position:sticky; bottom:90px; left:0; right:0; z-index:25;
  margin:8px 14px 0;
  background:var(--warn); color:#fff; border-radius:var(--radius-sm);
  padding:9px 14px; font-size:12px; font-weight:600;
  display:flex; align-items:center; gap:8px; justify-content:space-between;
  box-shadow:var(--sh-md); transform:translateY(0);
  transition:transform .2s, opacity .2s;
}
.save-banner.hidden { transform:translateY(8px); opacity:0; pointer-events:none; }
.save-banner button {
  border:none; background:rgba(255,255,255,.2); border-radius:var(--radius-sm);
  color:#fff; font-family:var(--font); font-weight:700; font-size:12px;
  padding:5px 12px; cursor:pointer;
}

/* ── TABBAR ──────────────────────────────────────────────────── */
.tabbar {
  position:fixed; bottom:0; left:0; right:0;
  display:flex; background:var(--surf);
  border-top:1px solid var(--border);
  box-shadow:0 -3px 20px rgba(60,30,10,.10);
  max-width:480px; margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom,0);
  backdrop-filter:blur(20px);
}
.tabbar button {
  flex:1; border:none; background:none;
  padding:9px 4px 7px; display:flex; flex-direction:column;
  align-items:center; gap:3px; font-family:var(--font);
  color:var(--muted); font-size:9px; font-weight:700;
  letter-spacing:.03em; cursor:pointer; transition:color .15s;
}
.tabbar button .ti {
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:17px; transition:background .2s, transform .15s;
}
.tabbar button.active { color:var(--role-color); }
.tabbar button.active .ti {
  background:color-mix(in srgb, var(--role-color) 14%, transparent);
  transform:scale(1.06);
}

/* ── SUBTABS ─────────────────────────────────────────────────── */
.subtab { display:flex; gap:6px; margin:14px 0 12px; flex-wrap:wrap; }
.subtab button {
  font-family:var(--font); font-size:12px; font-weight:700;
  padding:7px 16px; border-radius:999px; border:none;
  background:var(--surf2); color:var(--muted); cursor:pointer;
  transition:all .15s; border:1px solid var(--border);
}
.subtab button.active { background:var(--role-color); color:#fff; border-color:transparent; }

/* ── ROSTER EDITOR ───────────────────────────────────────────── */
.redit {
  display:flex; gap:8px; align-items:center; padding:8px 0;
}
.redit + .redit { border-top:1px solid var(--border); }
.redit input[type=text] {
  flex:1; font-family:var(--font); font-size:13px; font-weight:500;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:8px 10px; background:var(--surf2); color:var(--text);
}
.redit input::placeholder { color:var(--muted); font-weight:400; }
.sel-to {
  width:68px; flex:none; font-family:var(--font); font-size:12px;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:8px 6px; background:var(--surf2); color:var(--text);
  -webkit-appearance:none;
}
.rm-btn {
  border:none; background:none; color:var(--bad); font-size:17px;
  padding:4px 5px; cursor:pointer; flex-shrink:0;
}

/* ── COUNTER ─────────────────────────────────────────────────── */
.counter-card { display:flex; align-items:center; justify-content:space-between; }
.counter-num {
  font-size:52px; font-weight:800; line-height:1;
  letter-spacing:-.04em; font-variant-numeric:tabular-nums;
}
.counter-num.ok { color:var(--ok); }
.counter-btns { display:flex; gap:8px; }
.counter-btns button {
  width:44px; height:44px; border-radius:50%; border:none;
  background:var(--surf2); font-size:20px; color:var(--text);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:var(--sh); border:1px solid var(--border);
}

/* ── CHECK ROW ───────────────────────────────────────────────── */
.check-row {
  display:flex; align-items:center; gap:10px; padding:10px 0;
  font-size:14px; cursor:pointer;
}
.check-row input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); flex-shrink:0; }

/* ── WEEK CARD ───────────────────────────────────────────────── */
.wcard {
  background:var(--surf); border-radius:var(--radius-sm);
  padding:12px 14px; margin-bottom:8px;
  border:1px solid var(--border); box-shadow:var(--sh);
}
.wcard-title { font-size:14px; font-weight:700; }
.wcard-sub { font-size:12px; color:var(--muted); margin-top:3px; }
.bar-wrap { background:var(--surf2); border-radius:4px; height:4px; margin-top:8px; overflow:hidden; }
.bar-fill { height:100%; border-radius:4px; }
.flag { display:inline-block; margin-top:6px; font-size:11px; font-weight:700; background:var(--bad-bg); color:var(--bad); border-radius:6px; padding:3px 9px; }

/* ── DISCIPLINE ──────────────────────────────────────────────── */
.dentry { padding:10px 0; border-top:1px solid var(--border); font-size:13px; }
.dentry:first-child { border-top:none; }
.dentry-row { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
.dpts { font-weight:800; font-size:15px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.dpts.pos { color:var(--ok); }
.dpts.neg { color:var(--bad); }
.score-block { text-align:center; }
.score-num { font-size:30px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.score-lbl { font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-top:2px; }

/* ── LOCK SCREEN ─────────────────────────────────────────────── */
.lock { margin:40px 0; text-align:center; padding:0 8px; }
.lock-icon { font-size:44px; margin-bottom:12px; }
.lock h3 { font-size:20px; font-weight:800; margin:0 0 5px; }
.lock p { color:var(--muted); font-size:13px; margin:0 0 18px; }
.lock input {
  width:100%; font-family:var(--font); font-size:15px; font-weight:700;
  background:var(--surf); border:1px solid var(--border); border-radius:var(--radius);
  padding:13px; color:var(--text); text-align:center; letter-spacing:.18em;
  margin-bottom:8px; box-shadow:var(--sh);
}
.lock input::placeholder { color:var(--muted); letter-spacing:.02em; font-weight:400; font-size:13px; }
.lock-err { color:var(--bad); font-size:12px; margin-top:4px; min-height:18px; }

/* ── LOGIN SPLASH ────────────────────────────────────────────── */
.splash {
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:40px 20px; background:var(--bg);
  position:relative; overflow:hidden;
}
.splash::before {
  content:''; position:absolute; top:-80px; right:-60px;
  width:280px; height:280px; border-radius:50%;
  background:var(--accent); opacity:.07; pointer-events:none;
}
.splash::after {
  content:''; position:absolute; bottom:-60px; left:-40px;
  width:200px; height:200px; border-radius:50%;
  background:var(--ok); opacity:.06; pointer-events:none;
}
.splash .brand { font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.splash h1 { font-size:26px; font-weight:800; margin:0 0 4px; }
.splash .tagline { color:var(--muted); font-size:13px; margin:0 0 28px; text-align:center; }
.role-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:340px; margin-bottom:12px; }
.role-card {
  background:var(--surf); border-radius:16px; padding:16px 12px;
  display:flex; flex-direction:column; align-items:center; gap:7px;
  cursor:pointer; transition:transform .15s, box-shadow .15s;
  box-shadow:var(--sh); border:1px solid var(--border);
}
.role-card:active { transform:scale(.96); }
.role-card .rc-icon { width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:21px; background:var(--surf2); }
.role-card .rc-lbl { font-size:12px; font-weight:700; text-align:center; }
.role-card.selected { box-shadow:0 0 0 2.5px var(--sel-c, var(--accent)), var(--sh); }
.pass-box {
  width:100%; max-width:340px; background:var(--surf);
  border-radius:16px; padding:18px; margin-bottom:12px;
  box-shadow:var(--sh-md); border:1px solid var(--border);
  animation:slideUp .16s ease;
}
@keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.pass-box .pb-title { font-size:14px; font-weight:700; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
.pass-box input {
  width:100%; font-family:var(--font); font-size:15px; font-weight:700;
  background:var(--surf2); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:11px; color:var(--text); text-align:center; letter-spacing:.18em; margin-bottom:8px;
}
.pass-box input::placeholder { color:var(--muted); letter-spacing:.02em; font-weight:400; font-size:13px; }
.pass-box .pb-err { color:var(--bad); font-size:12px; margin-bottom:8px; min-height:16px; }
.pass-box .pb-submit {
  width:100%; padding:12px; border-radius:var(--radius-sm); border:none;
  font-family:var(--font); font-weight:700; font-size:14px; cursor:pointer; transition:opacity .15s;
}

/* ── TOAST ───────────────────────────────────────────────────── */
.toast {
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(6px);
  background:var(--text); color:var(--bg); padding:9px 18px; border-radius:999px;
  font-size:13px; font-weight:600; opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s; z-index:200; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── MISC ────────────────────────────────────────────────────── */
.empty { text-align:center; color:var(--muted); font-size:13px; padding:24px 8px; }
.badge { display:inline-block; font-size:11px; font-weight:700; border-radius:6px; padding:3px 9px; }
.badge-ok   { background:var(--ok-bg);   color:var(--ok); }
.badge-warn { background:var(--warn-bg); color:var(--warn); }
.badge-bad  { background:var(--bad-bg);  color:var(--bad); }
.loading-screen { display:flex; align-items:center; justify-content:center; height:100vh; color:var(--muted); gap:10px; flex-direction:column; }
.loading-screen .spin-icon { font-size:28px; animation:spin 1s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════ CẤU HÌNH ════════════════════════════════════
const API_URL   = 'https://script.google.com/macros/s/AKfycbykQfvYnE7ERzNQqz6kQI01ZjDSgjZAZvrVaTxDStSzvSy2lQFSppveNRxHtltP8oTKKQ/exec';

// ═════════════════════════════════════════════════════════════

const ROLE_META = {

  home:    {label:'Danh sách lớp',  short:'Lớp',      icon:'👥', color:'#8B6A3E'},
  lt:      {label:'Lớp trưởng',     short:'LT',       icon:'⭐', color:'#A85050'},
  hoctap:  {label:'LP Học tập',     short:'Học tập',  icon:'📚', color:'#3D7A9A'},
  laodong: {label:'LP Lao động',    short:'Lao động', icon:'🧹', color:'#3D7A5A'},
  kyluat:  {label:'Kỷ luật',        short:'Kỷ luật',  icon:'🥢', color:'#9A7620'},
  gvcn:    {label:'GVCN',           short:'GVCN',     icon:'👩‍🏫', color:'#7A5A9A'},
};

// ══ HELPERS ══════════════════════════════════════════════════
function todayStr(){const d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function monthStr(s){return s.slice(0,7);}
function p2(n){return String(n).padStart(2,'0');}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function fmtDate(s){const[y,m,d]=s.split('-'); return `${d}/${m}/${y}`;}
function escH(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function showToast(msg, dur=1800){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove('show'),dur);
}

// ══ API LAYER ═════════════════════════════════════════════════
// Retry helper
async function fetchWithRetry(url, retries=2){
  for(let i=0; i<=retries; i++){
    try{
      const res = await fetch(url, {method:'GET', mode:'cors'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    } catch(e){
      if(i===retries) throw e;
      await new Promise(r=>setTimeout(r, 600*(i+1)));
    }
  }
}

async function sget(key){
  try{
    const data = await fetchWithRetry(`${API_URL}?action=get&key=${encodeURIComponent(key)}&token=${encodeURIComponent(API_TOKEN)}`);
    if(data.error) throw new Error(data.error);
    if(state.connStatus !== 'ok'){ state.connStatus='ok'; updateConnDot(); }
    return data.value != null ? JSON.parse(data.value) : null;
  } catch(e){
    console.error('sget failed:', key, e.message);
    state.connStatus='error'; updateConnDot();
    return null;
  }
}

async function sset(key, value){
  // Optimistically mark saving
  const dotEl = document.querySelector('.conn-dot');
  if(dotEl){ dotEl.classList.add('spin'); }
  try{
    const url = `${API_URL}?action=set&key=${encodeURIComponent(key)}&value=${encodeURIComponent(JSON.stringify(value))}&token=${encodeURIComponent(API_TOKEN)}`;
    const data = await fetchWithRetry(url, 3);
    if(data.error) throw new Error(data.error);
    if(state.connStatus !== 'ok'){ state.connStatus='ok'; updateConnDot(); }
    if(dotEl){ dotEl.classList.remove('spin'); }
    return true;
  } catch(e){
    console.error('sset failed:', key, e.message);
    state.connStatus='error'; updateConnDot();
    if(dotEl){ dotEl.classList.remove('spin'); }
    showToast('⚠️ Lỗi lưu dữ liệu — kiểm tra kết nối');
    return false;
  }
}

// Local login (compare against known passcodes — same as GAS does)
function doLogin(role, passcode){
  return PASSCODES[role] && passcode === PASSCODES[role];
}

function updateConnDot(){
  document.querySelectorAll('.conn-dot').forEach(el=>{
    el.className = 'conn-dot ' + (state.connStatus==='ok'?'ok':state.connStatus==='error'?'bad':'spin');
  });
}

function render(){
  if(state.loading){
    document.getElementById('app').innerHTML=`<div class="loading-screen"><span class="spin-icon">⏳</span><span>Đang kết nối…</span></div>`;
    return;
  }

}

// ══ LOGIN SCREEN ══════════════════════════════════════════════
function renderLoginScreen(){
  const app=document.getElementById('app');
  const sel=state.loginSelectedRole;
  const cards = LOGIN_ROLES.map(r=>`
    <button class="role-card${sel&&sel.key===r.key?' selected':''}" data-lr="${r.key}" style="--sel-c:${r.color}">
      <span class="rc-icon">${r.icon}</span>
      <span class="rc-lbl">${r.label}</span>
    </button>`).join('') + `
    <button class="role-card" id="viewerCard" style="--sel-c:#7A7A7A">
      <span class="rc-icon">👀</span>
      <span class="rc-lbl">Xem tự do</span>
    </button>`;

  const passBox = sel ? `
    <div class="pass-box">
      <p class="pb-title">${sel.icon} ${sel.label}</p>
      <input type="password" id="splashPass" placeholder="Mật khẩu được cấp…" autocomplete="current-password">
      <p class="pb-err" id="splashErr"></p>
      <button class="pb-submit" id="splashSubmit" style="background:${sel.color};color:#fff;">Mở khoá →</button>
    </div>` : '';

  app.innerHTML=`
    <div class="splash">
      <p class="brand">Lớp 10B1 · Marie Curie</p>
      <h1>Xin chào 👋</h1>
      <p class="tagline">Chọn vai trò của bạn để tiếp tục</p>
      <div class="role-grid">${cards}</div>
      ${passBox}
    </div>`;

  app.querySelectorAll('[data-lr]').forEach(btn=>{
    btn.onclick=()=>{
      state.loginSelectedRole = LOGIN_ROLES.find(r=>r.key===btn.dataset.lr)||null;
      renderLoginScreen();
      setTimeout(()=>{ const p=document.getElementById('splashPass'); if(p) p.focus(); },40);
    };
  });

  const sub = document.getElementById('splashSubmit');
  if(sub) sub.onclick=()=>{
    const pass=document.getElementById('splashPass').value;
    const ok=doLogin(sel.key, pass);
    if(ok){
      state.unlocked[sel.key]=true;
      if(sel.tab==='kyluat') state.sub.kyluat=sel.key;
      state.tab=sel.tab; state.showLogin=false; state.loginSelectedRole=null;
      render();
    } else {
      document.getElementById('splashErr').textContent='Sai mật khẩu, thử lại.';
      document.getElementById('splashPass').value='';
      document.getElementById('splashPass').focus();
    }
  };
  const pin=document.getElementById('splashPass');
  if(pin) pin.onkeydown=e=>{ if(e.key==='Enter' && sub) sub.click(); };

  const vc=document.getElementById('viewerCard');
  if(vc) vc.onclick=()=>{ state.showLogin=false; state.isViewer=true; state.tab='public'; render(); };
}

function cover(title, sub, color, showDate){
  const dot = `<span class="conn-dot ${state.connStatus==='ok'?'ok':state.connStatus==='error'?'bad':'spin'}"></span>`;
  const datePart = showDate ? `
    <div class="datebar">
      <input type="date" id="dateInput" value="${state.date}">
      <button class="today-btn" data-act="today">Hôm nay</button>
    </div>` : '';
  return `<div class="cover" style="--role-color:${color}">
    <p class="eyebrow">${dot} Sổ quản lý · Lớp 10B1</p>
    <h1>${title}</h1>
    <p class="sub">${sub}</p>
  </div>${datePart}`;
}

function tabbar(){
  const tabs = state.isViewer
    ? Object.entries(ROLE_META).filter(([k])=>PUBLIC_TABS.includes(k))
    : Object.entries(ROLE_META).filter(([k])=>k!=='public');
  const loginBtn = state.isViewer
    ? `<button data-act="go-login" style="flex:none;padding:9px 10px;border:none;background:none;font-family:var(--font);font-size:9px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.03em;"><span class="ti" style="font-size:17px;">🔑</span>Đăng nhập</button>`
    : '';
  return `<nav class="tabbar">${tabs.map(([k,r])=>`
    <button data-tab="${k}" class="${state.tab===k?'active':''}" style="--role-color:${r.color}">
      <span class="ti">${r.icon}</span>${r.short}
    </button>`).join('')}${loginBtn}</nav>`;
}

function subtabs(group, items){
  const color = ROLE_META[state.tab].color;
  return `<div class="subtab">${items.map(([k,lbl])=>
    `<button data-sub="${group}:${k}" class="${state.sub[group]===k?'active':''}" style="--role-color:${color}">${lbl}</button>`
  ).join('')}</div>`;
}

function lockBody(label, color, roleKey){
  return `<div class="lock">
    <div class="lock-icon">🔐</div>
    <h3>${label}</h3>
    <p>Nhập mật khẩu được cấp để mở trang này.</p>
    <input type="password" id="lockInput" placeholder="Mật khẩu…">
    <button class="btn-primary" style="background:${color};color:#fff;margin-top:6px;" data-act="do-lock-login" data-role="${roleKey}">Mở khoá →</button>
    <p class="lock-err" id="lockErr"></p>

// ══ ASYNC RENDER ══════════════════════════════════════════════
async function renderAsync(){
  const app=document.getElementById('app');
  const r=ROLE_META[state.tab];
  let ch='', mh='';

  if(state.tab==='public'){
    ch=cover('Báo cáo lớp 10B1',`Xem tự do · ${fmtDate(state.date)}`,r.color,true);
    mh=await renderPublic();
  } else if(state.tab==='home'){
    ch=cover('Danh sách lớp',`${state.roster.length} học sinh`,r.color,false);
    mh=await guarded('gvcn',renderHome,r.color,'gvcn');
  } else if(state.tab==='lt'){
    ch=cover('Lớp trưởng','Điểm danh · Thu điện thoại · Hòm',r.color,true);
    mh=await guarded('lop-truong',renderLT,r.color,'lop-truong');
  } else if(state.tab==='hoctap'){
    ch=cover('LP Học tập','Truy bài đầu giờ 15 phút',r.color,true);
    mh=await guarded('hoc-tap',renderHocTap,r.color,'hoc-tap');
  } else if(state.tab==='laodong'){
    ch=cover('LP Lao động','Phân công & kiểm tra trực nhật',r.color,true);
    mh=await guarded('lao-dong',renderLaoDong,r.color,'lao-dong');
  } else if(state.tab==='kyluat'){
    ch=cover('Kỷ luật','Điểm nền nếp · điểm cộng & gậy',r.color,true);
    const sh=subtabs('kyluat',[['to-1','Tổ 1'],['to-2','Tổ 2'],['to-3','Tổ 3']]);
    if(!state.unlocked[state.sub.kyluat]){
      mh=`<main>${sh}${lockBody('Tổ trưởng Tổ '+state.sub.kyluat.split('-')[1],r.color,state.sub.kyluat)}</main>`;
    } else { mh=await renderKyLuat(sh); }
  } else if(state.tab==='gvcn'){
    ch=cover('GVCN','Tổng hợp tình hình lớp',r.color,true);
    mh=await guarded('gvcn',renderGVCN,r.color,'gvcn');
  }

  app.innerHTML=ch+mh+tabbar();
  attachHandlers();
}

async function guarded(roleKey, fn, color, rk){
  if(!state.unlocked[roleKey]) return `<main>${lockBody(ROLE_META[state.tab].label,color,rk)}</main>`;
  return await fn();
}

// ══ PUBLIC VIEW ════════════════════════════════════════════════
async function renderPublic(){
  const [attRaw,studyRaw,discLog]=await Promise.all([
    sget('attendance:'+state.date),
    sget('study:'+state.date),
    sget('discipline:log:'+state.month),
  ]);
  const att=attRaw||{status:{},phoneCount:0};
  const study=studyRaw||{status:{}};
  const log=Array.isArray(discLog)?discLog:[];

  const present=[],late=[],absent=[];
  state.roster.forEach(s=>{
    const st=att.status[s.id]||'present';
    if(st==='present') present.push(s.name);
    else if(st==='late') late.push(s.name);
    else absent.push(s.name);
  });

  const attHtml=`<div class="card">
    <div class="row"><span class="name" style="color:var(--ok)">✅ Đúng giờ</span><span style="font-weight:700">${present.length} bạn</span></div>
    ${late.length?`<div class="row"><span class="name" style="color:var(--warn)">⏰ Muộn</span><span style="font-size:13px;color:var(--muted)">${late.join(', ')}</span></div>`:''}
    ${absent.length?`<div class="row"><span class="name" style="color:var(--bad)">🚫 Vắng</span><span style="font-size:13px;color:var(--muted)">${absent.join(', ')}</span></div>`:''}
    ${!late.length&&!absent.length?'<p class="empty" style="padding:8px 0">Cả lớp đi đúng giờ hôm nay 🎉</p>':''}
  </div>`;

  const studyIssues=state.roster.filter(s=>['partial','none','noequip'].includes(study.status[s.id]));
  const sLabel={partial:'Thiếu bài',none:'Không làm bài',noequip:'Thiếu dụng cụ'};
  const studyHtml=studyIssues.length
    ?`<div class="card">${studyIssues.map(s=>`<div class="row"><span class="name">${escH(s.name)}</span><span class="badge badge-warn">${sLabel[study.status[s.id]]}</span></div>`).join('')}</div>`
    :`<div class="card"><p class="empty" style="padding:8px 0">Cả lớp hoàn thành bài tập 📚</p></div>`;

  const agg={};
  log.forEach(e=>{
    if(!agg[e.studentId]) agg[e.studentId]={cong:0,gay:0};
    if(e.type==='cong') agg[e.studentId].cong+=e.value; else agg[e.studentId].gay+=e.value;
  });
  const ranked=state.roster.map(s=>({...s,...(agg[s.id]||{cong:0,gay:0})})).sort((a,b)=>b.cong-a.cong||a.gay-b.gay);
  const medals=['🥇','🥈','🥉'];
  const rankHtml=ranked.length?ranked.map((s,i)=>`
    <div class="row">
      <span class="idx" style="width:24px;font-size:14px">${medals[i]||i+1}</span>
      <span class="name">${escH(s.name)}</span>
      <span style="font-size:12px;white-space:nowrap">
        <span style="color:var(--ok);font-weight:700">+${s.cong}đ</span>
        ${s.gay?` · <span style="color:var(--bad)">${s.gay}🥢</span>`:''}
      </span>
    </div>`).join(''):'<p class="empty">Chưa có dữ liệu tháng này.</p>';

  return `<main>
    <h2 class="sec">Điểm danh hôm nay</h2>${attHtml}
    <h2 class="sec">Học tập đầu giờ</h2>${studyHtml}
    <h2 class="sec">Ranking nền nếp <input type="month" id="monthInput" value="${state.month}"></h2>
    <div class="card">${rankHtml}</div>
    <p style="text-align:center;font-size:11px;color:var(--muted);margin-top:4px">👀 Chỉ xem · không thể chỉnh sửa</p>
  </main>`;
}

      ${subtabs('hoctap',[['today','Hôm nay'],['week','Tổng hợp tuần']])}
      <label class="check-row" style="margin-bottom:10px">

      </label>

      <div class="card">${rows||emptyRoster()}</div>
      <button class="btn-primary" style="background:${ROLE_META.hoctap.color}" data-act="save-ht">💾 Lưu kết quả học tập</button>
    </main>`;
  } else {
    const weekData=await computeWeekly();
    const rows=state.roster.map(s=>{
      const c=weekData[s.id]||{partial:0,none:0,noequip:0};
      const issues=c.partial+c.none+c.noequip;
      const flagged=issues>=3;
      const pct=Math.min(100,issues*100/7);
      return `<div class="wcard">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="wcard-title">${escH(s.name)}</span>
          <span style="font-size:13px;font-weight:700;color:${flagged?'var(--bad)':'var(--muted)'}">${issues} lần</span>
        </div>
        ${flagged?'<span class="flag">⚠️ Cần chú ý</span>':''}
        <div class="wcard-sub">Thiếu: ${c.partial} · Không làm: ${c.none} · Thiếu ĐD: ${c.noequip}</div>
        <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${flagged?'var(--bad)':'var(--warn)'}"></div></div>
      </div>`;
    }).join('');
    return `<main>
      ${subtabs('hoctap',[['today','Hôm nay'],['week','Tổng hợp tuần']])}
      <h2 class="sec">7 ngày gần nhất</h2>
      <p style="font-size:12px;color:var(--muted);margin-bottom:12px">Từ 3 lần trở lên → cần chú ý.</p>
      ${rows||emptyRoster()}
    </main>`;
  }
}
async function computeWeekly(){
  const dates=[];
  const d=new Date(state.date+'T00:00:00');
  for(let i=0;i<7;i++){const dd=new Date(d);dd.setDate(d.getDate()-i);dates.push(dd.getFullYear()+'-'+p2(dd.getMonth()+1)+'-'+p2(dd.getDate()));}
  const res={};
  const recs=await Promise.all(dates.map(dt=>sget('study:'+dt)));
  recs.forEach(r=>{
    if(!r) return;
    for(const[sid,st] of Object.entries(r.status||{})){
      if(!res[sid]) res[sid]={partial:0,none:0,noequip:0};
      if(st==='partial') res[sid].partial++;
      if(st==='none') res[sid].none++;
      if(st==='noequip') res[sid].noequip++;
    }
  });
  return res;
}

async function renderLaoDong(){

      <h2 class="sec">Trực nhật hôm nay</h2>

          <button data-v="pass" style="flex:1${ldDayData.checked==='pass'?';background:var(--ok);color:#fff':''}">✓ Đạt</button>
          <button data-v="fail" style="flex:1${ldDayData.checked==='fail'?';background:var(--bad);color:#fff':''}">✗ Chưa đạt</button>
        </div>
        <textarea class="note-input" id="dutyNote" rows="2" placeholder="Ghi chú (vd: bảng chưa lau…)" style="margin-top:10px">${escH(ldDayData.note||'')}</textarea>
      </div>
      <button class="btn-primary" style="background:${ROLE_META.laodong.color}" data-act="save-duty">💾 Lưu kết quả trực nhật</button>
    </main>`;
  } else if(state.sub.laodong==='upcoming'){
    let rows='';
    const d0=new Date(state.date+'T00:00:00');
    for(let i=0;i<7;i++){
      const dd=new Date(d0);dd.setDate(d0.getDate()+i);
      const ds=dd.getFullYear()+'-'+p2(dd.getMonth()+1)+'-'+p2(dd.getDate());
      const ids=computeAssigned(ds);
      const names=ids.map(id=>state.roster.find(s=>s.id===id)?.name||'?').join(', ');
      rows+=`<div class="wcard"><div class="wcard-title">${fmtDate(ds)}${i===0?' · hôm nay':''}</div><div class="wcard-sub">${names||'—'}</div></div>`;
    }
    return `<main>${subtabs('laodong',[['today','Hôm nay'],['upcoming','Sắp tới'],['config','Cài đặt']])}<h2 class="sec">Gợi ý 7 ngày tới</h2>${rows}</main>`;
  } else {
    return `<main>
      ${subtabs('laodong',[['today','Hôm nay'],['upcoming','Sắp tới'],['config','Cài đặt']])}
      <h2 class="sec">Cài đặt vòng quay</h2>
      <div class="card">
        <label class="lbl">Số bạn trực mỗi buổi</label>
        <input type="text" inputmode="numeric" class="field-input" id="groupSizeInput" value="${ldConfig.groupSize}">
        <label class="lbl">Ngày bắt đầu vòng quay</label>
        <input type="date" class="field-input" id="startDateInput" value="${ldConfig.startDate}">
        <button class="btn-primary" style="background:${ROLE_META.laodong.color}" data-act="save-duty-config">💾 Lưu cài đặt</button>
      </div>
      <p style="font-size:12px;color:var(--muted)">Đây là gợi ý — vẫn có thể tick tay ở tab Hôm nay.</p>
    </main>`;
  }
}
function computeAssigned(dateStr){
  if(!ldConfig||ldConfig.order.length===0) return [];
  const start=new Date(ldConfig.startDate+'T00:00:00');
  const cur=new Date(dateStr+'T00:00:00');
  const dayIdx=Math.floor((cur-start)/86400000);
  const n=ldConfig.order.length;
  const size=Math.max(1,parseInt(ldConfig.groupSize)||1);
  const groups=Math.ceil(n/size);
  if(dayIdx<0||groups===0) return ldConfig.order.slice(0,size);
  const g=((dayIdx%groups)+groups)%groups;
  return ldConfig.order.slice(g*size,g*size+size);
}

function gayTier(total){
  if(total>=3) return{label:'Báo phụ huynh · cân nhắc hạnh kiểm'};
  if(total===2) return{label:'Viết kiểm điểm + phạt trực nhật 3 ngày'};
  if(total===1) return{label:'Khiển trách'};
  return null;
}
function quyenLoiTier(total){
  const b=[];
  if(total>50) b.push('Đổi chỗ ngồi theo ý muốn');
  if(total>=40) b.push('Quà to + tuyên dương');
  else if(total>=20) b.push('Quà nhỏ + tuyên dương');
  return b;
}
function aggregateLog(log){
  const agg={};
  log.forEach(e=>{
    if(!agg[e.studentId]) agg[e.studentId]={cong:0,gay:0};
    if(e.type==='cong') agg[e.studentId].cong+=e.value; else agg[e.studentId].gay+=e.value;
  });
  return agg;
}

// ══ GVCN ════════════════════════════════════════════════════════
async function renderGVCN(){
  function prevMonths(month,n){
    const[y,m]=month.split('-').map(Number); const arr=[];
    for(let i=0;i<n;i++){let mm=m-i,yy=y; while(mm<=0){mm+=12;yy--;} arr.push(yy+'-'+p2(mm));}
    return arr;
  }
  const months3=prevMonths(state.month,3);
  const [attRaw,studyRaw,dutyRaw,assign,...logsByMonth]=await Promise.all([
    sget('attendance:'+state.date),
    sget('study:'+state.date),
    sget('duty:'+state.date),
    sget('assignments'),
    ...months3.map(m=>sget('discipline:log:'+m).then(r=>Array.isArray(r)?r:[])),
  ]);
  const att=attRaw||{status:{},phoneCount:0,openedBox:false,closedBox:false};
  const lateList=[],absentList=[];
  state.roster.forEach(s=>{const st=att.status[s.id]||'present'; if(st==='late') lateList.push(s.name); else if(st==='absent') absentList.push(s.name);});
  const study=studyRaw||{status:{},remind:false};
  const issueList=state.roster.filter(s=>['partial','none','noequip'].includes(study.status[s.id])).map(s=>({name:s.name,st:study.status[s.id]}));
  const duty=dutyRaw||null;
  const dutyNames=duty?duty.assigned.map(id=>state.roster.find(s=>s.id===id)?.name||'?'):[];
  const aggByMonth=logsByMonth.map(aggregateLog);
  const agg=aggByMonth[0];

  const discRows=[1,2,3].map(toNum=>{
    const students=state.roster.filter(s=>s.to===toNum);
    const rows=students.map(s=>{
      const a=agg[s.id]||{cong:0,gay:0};
      const tier=gayTier(a.gay);
      const badges=quyenLoiTier(a.cong);
      const chronic=months3.every((m,i)=>(aggByMonth[i][s.id]?.gay||0)>=3);
      return `<div class="row"><span class="name">${escH(s.name)}</span>
        <span style="font-size:12px;color:var(--muted)">
          <span style="color:var(--ok);font-weight:700">+${a.cong}đ</span> ·
          <span style="color:var(--bad)">${a.gay}🥢</span>
          ${tier?' · '+tier.label:''}
          ${chronic?' · <b style="color:var(--bad)">Cân nhắc hạnh kiểm</b>':''}
          ${badges.length?' · 🎁 '+badges.join(', '):''}
        </span></div>`;
    }).join('');
    return `<h2 class="sec">Tổ ${toNum}</h2><div class="card">${rows||emptyRoster()}</div>`;
  }).join('');

  const asgn=assign||{};
  const asgnRows=ASSIGNMENT_FIELDS.map(f=>`<div class="row"><span class="name">${f.title}</span><span style="font-size:13px;color:var(--muted)">${escH(asgn[f.key]||'(chưa có)')}</span></div>`).join('');

  return `<main>
    <h2 class="sec">Điểm danh ${fmtDate(state.date)}</h2>
    <div class="card">
      <div style="font-size:13px;line-height:1.7">
        🚫 Vắng: <b>${absentList.join(', ')||'không có'}</b><br>
        ⏰ Muộn: <b>${lateList.join(', ')||'không có'}</b><br>
        📱 Thu ĐT: <b>${att.phoneCount}/${state.roster.length}</b> · Hòm: ${att.openedBox?'đã mở':'chưa mở'} / ${att.closedBox?'đã dọn':'chưa dọn'}
      </div>
    </div>
    <h2 class="sec">Truy bài hôm nay</h2>
    <div class="card">
      ${issueList.length?issueList.map(x=>`<div style="font-size:13px;padding:4px 0">${escH(x.name)} — ${x.st==='partial'?'thiếu bài':x.st==='none'?'không làm bài':'thiếu dụng cụ'}</div>`).join(''):'<p class="empty" style="padding:8px 0">Không có vấn đề gì hôm nay ✓</p>'}
      <div style="font-size:12px;color:var(--muted);margin-top:6px">Đã nhắc BTVN: ${study.remind?'✓':'chưa'}</div>
    </div>
    <h2 class="sec">Trực nhật hôm nay</h2>
    <div class="card">
      <div style="font-size:13px">${dutyNames.join(', ')||'chưa phân công'}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Kiểm tra: ${duty&&duty.checked==='pass'?'✓ Đạt':duty&&duty.checked==='fail'?'✗ Chưa đạt':'chưa kiểm tra'}${duty&&duty.note?' — '+escH(duty.note):''}</div>
    </div>
    <h2 class="sec">Nền nếp tháng <input type="month" id="monthInput" value="${state.month}"></h2>
    ${discRows}
    <h2 class="sec">Phân công nhiệm vụ</h2>
    <div class="card">${asgnRows}</div>
  </main>`;
}

function attachHandlers(){
  const app=document.getElementById('app');

  // Tabs
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; renderAsync(); });
  const goLogin=app.querySelector('[data-act="go-login"]');
  if(goLogin) goLogin.onclick=()=>{ state.showLogin=true; state.isViewer=false; state.loginSelectedRole=null; render(); };

  // Subtabs
  app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{
    const[g,k]=b.dataset.sub.split(':');
    state.sub[g]=k;
    if(g==='kyluat') disciplineForm={type:'cong',studentId:'',category:''};
    renderAsync();
  });

  // Date
  const di=document.getElementById('dateInput');
  if(di) di.onchange=()=>{ state.date=di.value; ltLoadedDate=null; htLoadedDate=null; ldLoadedDate=null; renderAsync(); };
  const todayBtn=app.querySelector('[data-act="today"]');
  if(todayBtn) todayBtn.onclick=()=>{ state.date=todayStr(); ltLoadedDate=null; htLoadedDate=null; ldLoadedDate=null; renderAsync(); };
  const mi=document.getElementById('monthInput');
  if(mi) mi.onchange=()=>{ state.month=mi.value; renderAsync(); };

  // Lock login
  const lockBtn=app.querySelector('[data-act="do-lock-login"]');
  if(lockBtn) lockBtn.onclick=()=>{
    const val=document.getElementById('lockInput').value;
    const ok=doLogin(lockBtn.dataset.role, val);
    if(ok){ state.unlocked[lockBtn.dataset.role]=true; renderAsync(); }
    else { document.getElementById('lockErr').textContent='Sai mật khẩu, thử lại.'; }
  };
  const lockIn=document.getElementById('lockInput');
  if(lockIn) lockIn.onkeydown=e=>{ if(e.key==='Enter'&&lockBtn) lockBtn.click(); };

  // Roster
  const addS=app.querySelector('[data-act="add-s"]');
  if(addS) addS.onclick=()=>{
    state.roster.push({id:uid(),name:'',to:null}); render();
    const ins=app.querySelectorAll('.rname'); if(ins.length) ins[ins.length-1].focus();
  };
  app.querySelectorAll('[data-act="rm-s"]').forEach(b=>b.onclick=()=>{ state.roster=state.roster.filter(s=>s.id!==b.dataset.id); render(); });
  app.querySelectorAll('.rname').forEach((inp,i)=>inp.oninput=()=>{ state.roster[i].name=inp.value; });
  app.querySelectorAll('.sel-to').forEach(s=>s.onchange=()=>{
    const r=state.roster.find(x=>x.id===s.dataset.id); if(r) r.to=s.value?parseInt(s.value):null;
  });
  const saveRoster=app.querySelector('[data-act="save-roster"]');
  if(saveRoster) saveRoster.onclick=async()=>{
    state.roster=state.roster.filter(s=>s.name.trim()!=='');
    saveRoster.textContent='Đang lưu…'; saveRoster.classList.add('saving');
    const ok=await sset('roster',state.roster);
    saveRoster.textContent='💾 Lưu danh sách'; saveRoster.classList.remove('saving');
    if(ok) showToast('✓ Đã lưu danh sách lớp');
    render();
  };
  const saveAssign=app.querySelector('[data-act="save-assign"]');
  if(saveAssign) saveAssign.onclick=async()=>{
    const obj={};
    app.querySelectorAll('.assign-input').forEach(inp=>{ obj[inp.dataset.key]=inp.value; });
    saveAssign.textContent='Đang lưu…'; saveAssign.classList.add('saving');
    const ok=await sset('assignments',obj);
    saveAssign.textContent='💾 Lưu phân công'; saveAssign.classList.remove('saving');
    if(ok) showToast('✓ Đã lưu phân công');
  };

  // LT — attendance segments (auto-save)
  app.querySelectorAll('[data-g="att"]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      ltData.status[seg.dataset.id]=b.dataset.v; renderAsync();
      // auto-save silently
      sset('attendance:'+state.date, ltData);
    });
  });
  // Phone counter
  const pInc=app.querySelector('[data-act="phone-inc"]');
  const pDec=app.querySelector('[data-act="phone-dec"]');
  if(pInc) pInc.onclick=()=>{ ltData.phoneCount=Math.min(state.roster.length,(ltData.phoneCount||0)+1); renderAsync(); sset('attendance:'+state.date,ltData); };
  if(pDec) pDec.onclick=()=>{ ltData.phoneCount=Math.max(0,(ltData.phoneCount||0)-1); renderAsync(); sset('attendance:'+state.date,ltData); };
  const chkOpen=app.querySelector('[data-act="chk-open"]');
  if(chkOpen) chkOpen.onchange=()=>{ ltData.openedBox=chkOpen.checked; sset('attendance:'+state.date,ltData); };
  const chkClose=app.querySelector('[data-act="chk-close"]');
  if(chkClose) chkClose.onchange=()=>{ ltData.closedBox=chkClose.checked; sset('attendance:'+state.date,ltData); };
  // Explicit save LT
  const saveLT=app.querySelector('[data-act="save-lt"]');
  if(saveLT) saveLT.onclick=async()=>{
    saveLT.textContent='Đang lưu…'; saveLT.classList.add('saving');
    const ok=await sset('attendance:'+state.date,ltData);
    saveLT.textContent='💾 Lưu điểm danh hôm nay'; saveLT.classList.remove('saving');
    if(ok) showToast('✓ Đã lưu điểm danh');
  };

  // Study segments (auto-save)
  app.querySelectorAll('[data-g="study"]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      htData.status[seg.dataset.id]=b.dataset.v; renderAsync();
      sset('study:'+state.date,htData);
    });
  });
  const chkRemind=app.querySelector('[data-act="chk-remind"]');
  if(chkRemind) chkRemind.onchange=()=>{ htData.remind=chkRemind.checked; sset('study:'+state.date,htData); };
  const saveHT=app.querySelector('[data-act="save-ht"]');
  if(saveHT) saveHT.onclick=async()=>{
    saveHT.textContent='Đang lưu…'; saveHT.classList.add('saving');
    const ok=await sset('study:'+state.date,htData);
    saveHT.textContent='💾 Lưu kết quả học tập'; saveHT.classList.remove('saving');
    if(ok) showToast('✓ Đã lưu học tập');
  };

  // Duty
  app.querySelectorAll('[data-act="toggle-duty"]').forEach(chk=>{
    chk.onchange=()=>{
      const id=chk.dataset.id; const idx=ldDayData.assigned.indexOf(id);
      if(idx>=0) ldDayData.assigned.splice(idx,1); else ldDayData.assigned.push(id);
      sset('duty:'+state.date,ldDayData);
    };
  });
  app.querySelectorAll('[data-g="duty-check"] button').forEach(b=>{
    b.onclick=()=>{ ldDayData.checked=b.dataset.v; renderAsync(); sset('duty:'+state.date,ldDayData); };
  });
  const saveDuty=app.querySelector('[data-act="save-duty"]');
  if(saveDuty) saveDuty.onclick=async()=>{
    const note=document.getElementById('dutyNote')?.value||'';
    ldDayData.note=note;
    saveDuty.textContent='Đang lưu…'; saveDuty.classList.add('saving');
    const ok=await sset('duty:'+state.date,ldDayData);
    saveDuty.textContent='💾 Lưu kết quả trực nhật'; saveDuty.classList.remove('saving');
    if(ok) showToast('✓ Đã lưu trực nhật');
  };
  const saveDutyConfig=app.querySelector('[data-act="save-duty-config"]');
  if(saveDutyConfig) saveDutyConfig.onclick=async()=>{
    ldConfig.groupSize=Math.max(1,parseInt(document.getElementById('groupSizeInput').value)||1);
    ldConfig.startDate=document.getElementById('startDateInput').value||state.date;
    saveDutyConfig.textContent='Đang lưu…'; saveDutyConfig.classList.add('saving');
    const ok=await sset('duty:config',ldConfig);
    saveDutyConfig.textContent='💾 Lưu cài đặt'; saveDutyConfig.classList.remove('saving');
    if(ok){ showToast('✓ Đã lưu cài đặt'); renderAsync(); }
  };

  // Discipline form type
  app.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>{ disciplineForm.type=b.dataset.ft; disciplineForm.category=''; renderAsync(); });
  const dStu=document.getElementById('discStu');
  if(dStu) dStu.onchange=()=>{ disciplineForm.studentId=dStu.value; };
  const dCat=document.getElementById('discCat');
  if(dCat) dCat.onchange=()=>{ disciplineForm.category=dCat.value; renderAsync(); };
  const addDisc=app.querySelector('[data-act="add-disc"]');
  if(addDisc) addDisc.onclick=async()=>{
    const studentId=document.getElementById('discStu').value;
    const category=document.getElementById('discCat').value;
    const note=(document.getElementById('discNote')?.value||'').trim();
    if(!studentId){ showToast('Chọn học sinh trước đã'); return; }
    let value;
    if(category==='Khác'){
      value=parseInt(document.getElementById('discCustomVal')?.value||'');
      if(isNaN(value)){ showToast('Nhập số điểm/gậy hợp lệ'); return; }
    } else {
      const list=disciplineForm.type==='cong'?CONG_CATEGORIES:VIPHAM_CATEGORIES;
      const found=list.find(c=>c.label===category);
      if(!found){ showToast('Chọn danh mục trước'); return; }
      value=disciplineForm.type==='cong'?found.pts:found.gay;
    }
    const entryMonth=state.date.slice(0,7);
    const log=await sget('discipline:log:'+entryMonth)||[];
    log.push({id:uid(),studentId,type:disciplineForm.type,category,value,note,date:state.date});
    addDisc.textContent='Đang lưu…'; addDisc.classList.add('saving');
    const ok=await sset('discipline:log:'+entryMonth,log);
    addDisc.textContent='💾 Lưu ghi nhận'; addDisc.classList.remove('saving');
    if(ok){ showToast('✓ Đã lưu ghi nhận'); disciplineForm.studentId=''; disciplineForm.category=''; renderAsync(); }
  };
}

// ══ GO ═══════════════════════════════════════════════════════
init();
</script>
</body>
</html>
