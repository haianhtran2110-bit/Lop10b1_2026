<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lớp 10B1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0EAE2;
  --surf:#FFFFFF;
  --surf2:#EDE6DC;
  --border:rgba(140,100,65,0.12);
  --text:#2A1F14;
  --muted:#8C7B70;
  --accent:#9B6E45;
  --ok:#5C8F6A;
  --warn:#B8892E;
  --bad:#B85555;
  --teal:#5C8F6A;
  --red:#B85555;
  --amber:#B8892E;
  --info:#8C7B70;
  --role-color:var(--accent);
  --radius:16px;
  --shadow:0 4px 18px rgba(80,50,25,0.10);
  --shadow-sm:0 2px 8px rgba(80,50,25,0.08);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  margin:0;
  font-family:'Be Vietnam Pro',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}
.app{max-width:480px;margin:0 auto;padding-bottom:92px;min-height:100vh;}

/* COVER */
.cover{
  padding:54px 20px 24px;
  position:relative;overflow:hidden;
  background:var(--surf);
}
.cover-blob{
  position:absolute;top:-40px;right:-40px;width:160px;height:160px;
  border-radius:50%;
  background:var(--role-color);
  opacity:.13;pointer-events:none;filter:blur(2px);
}
.cover-blob2{
  position:absolute;bottom:-30px;left:20px;width:90px;height:90px;
  border-radius:50%;
  background:var(--role-color);
  opacity:.07;pointer-events:none;filter:blur(1px);
}
.cover .eyebrow{font-size:10px;letter-spacing:.13em;font-weight:700;color:var(--accent);text-transform:uppercase;margin:0 0 8px;}
.cover h1{margin:0;font-size:26px;font-weight:800;line-height:1.2;color:var(--text);}
.cover .sub{margin:5px 0 0;font-size:13px;color:var(--muted);}

/* DATE BAR */
.datebar{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;background:var(--surf);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);
}
.datebar input[type=date]{
  font-family:'DM Sans',inherit;font-size:13px;border:1px solid var(--border);
  background:var(--surf2);border-radius:12px;padding:7px 10px;color:var(--text);flex:1;
}
.datebar input[type=date]::-webkit-calendar-picker-indicator{opacity:.5;}
.datebar .today-btn{
  font-size:12px;font-family:inherit;font-weight:600;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:12px;padding:7px 12px;color:var(--muted);white-space:nowrap;cursor:pointer;
}

/* MAIN */
main{padding:16px 16px 8px;}
h2.section{font-size:11px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;}
h2.section input[type=month]{font-family:inherit;font-size:12px;border:1px solid var(--border);border-radius:10px;padding:4px 8px;background:var(--surf2);color:var(--text);margin-left:8px;letter-spacing:0;}

/* CARD */
.card{background:var(--surf);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);}

/* ROW */
.row{display:flex;align-items:center;gap:10px;padding:11px 0;flex-wrap:wrap;}
.row+.row{border-top:1px solid var(--border);}
.name{flex:1;font-size:14px;font-weight:500;}
.name.full-w{flex-basis:100%;}
.idx{width:22px;font-size:11px;color:var(--muted);font-weight:600;text-align:right;}

/* SEGMENTED */
.seg{display:flex;background:var(--surf2);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
.seg button{border:none;background:none;padding:8px 10px;font-size:12px;font-family:inherit;font-weight:600;color:var(--muted);cursor:pointer;flex:1;transition:background .15s,color .15s;white-space:nowrap;}
.seg button+button{border-left:1px solid var(--border);}
.seg button.on-ok{background:var(--ok);color:#fff;}
.seg button.on-warn{background:var(--warn);color:#fff;}
.seg button.on-bad{background:var(--bad);color:#fff;}
.seg button.on-info{background:var(--surf);color:var(--muted);}
.seg.seg4{width:100%;}
.seg.seg4 button{font-size:11px;padding:8px 4px;}

/* INPUTS */
.note-input{width:100%;margin-top:6px;font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surf2);color:var(--text);}
.note-input::placeholder{color:var(--muted);}
textarea.note-input{resize:vertical;}

/* PILLS */
.stat-strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.pill{background:var(--surf);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--muted);box-shadow:var(--shadow-sm);}
.pill b{color:var(--text);}

/* COUNTER */
.counter-card{display:flex;align-items:center;justify-content:space-between;}
.counter-num{font-size:48px;font-weight:800;line-height:1;letter-spacing:-.03em;}
.counter-num.ok{color:var(--ok);}
.counter-btns{display:flex;gap:8px;}
.counter-btns button{width:46px;height:46px;border-radius:50%;border:none;background:var(--surf2);font-size:20px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);}

/* CHECK ROW */
.check-row{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px;cursor:pointer;}
.check-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;}

/* TABBAR */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;display:flex;
  background:var(--surf);
  border-top:1px solid var(--border);
  box-shadow:0 -4px 24px rgba(90,55,35,0.08);
  backdrop-filter:blur(20px);max-width:480px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.tabbar button{flex:1;border:none;background:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;color:var(--muted);font-size:9px;font-weight:600;letter-spacing:.03em;cursor:pointer;transition:color .15s;}
.tabbar button .ticon{
  font-size:18px;line-height:1;width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:transparent;transition:background .2s,transform .15s;
}
.tabbar button.active .ticon{background:color-mix(in srgb, var(--role-color) 15%, transparent);}
.tabbar button.active{color:var(--role-color);}
.tabbar button.active .ticon{transform:scale(1.08);}

/* SUBTABS */
.subtab{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.subtab button{font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:999px;border:none;background:var(--surf2);color:var(--muted);cursor:pointer;transition:all .15s;}
.subtab button.active{background:var(--role-color);color:#fff;}

/* ROSTER EDIT */
.roster-edit-row{display:flex;gap:8px;align-items:center;padding:7px 0;}
.roster-edit-row+.roster-edit-row{border-top:1px solid var(--border);}
.roster-edit-row input[type=text]{flex:1;font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:12px;padding:9px 10px;background:var(--surf2);color:var(--text);}
.roster-edit-row input[type=text]::placeholder{color:var(--muted);}
.rm-btn{border:none;background:none;color:var(--bad);font-size:18px;padding:4px 6px;cursor:pointer;}
.select-to{font-family:inherit;font-size:12px;border:1px solid var(--border);border-radius:10px;padding:7px 8px;background:var(--surf2);color:var(--text);width:74px;flex:none;}

/* BUTTONS */
.add-btn,.primary-btn{width:100%;padding:14px;border-radius:14px;border:none;font-family:inherit;font-weight:700;font-size:14px;margin-top:8px;cursor:pointer;transition:opacity .15s;}
.add-btn{background:var(--surf2);color:var(--muted);border:1.5px dashed var(--border);}
.primary-btn{background:var(--role-color);color:#fff;}

/* MISC */
.empty{text-align:center;color:var(--muted);font-size:13px;padding:28px 8px;}
.badge-flag{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;background:rgba(192,96,96,.12);color:var(--bad);border-radius:8px;padding:3px 10px;}
.week-name{font-weight:600;font-size:14px;}
.week-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.bar-wrap{background:var(--surf2);border-radius:4px;height:4px;margin-top:8px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;}
.week-card{background:var(--surf);border-radius:var(--radius);padding:14px;margin-bottom:8px;box-shadow:var(--shadow-sm);}

/* DISCIPLINE */
.disc-entry{padding:10px 0;border-top:1px solid var(--border);font-size:13px;}
.disc-entry:first-child{border-top:none;}
.disc-pts{font-weight:700;font-size:15px;white-space:nowrap;}
.disc-pts.pos{color:var(--ok);}
.disc-pts.neg{color:var(--bad);}
.disc-summary{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.score-block{text-align:center;}
.score-block .score-num{font-size:34px;font-weight:800;line-height:1;}
.score-block .score-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}

/* DISCIPLINE CHIPS */
.disc-chip{font-size:11px;padding:4px 9px;border-radius:20px;border:1.5px solid;background:transparent;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;line-height:1.4;white-space:nowrap;}
.vipham-chip{border-color:var(--red);color:var(--red);}
.vipham-chip.active{background:var(--red);color:#fff;}
.cong-chip{border-color:var(--teal);color:var(--teal);}
.cong-chip.active{background:var(--teal);color:#fff;}
.disc-chip-label{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px;}
details[open] .details-arrow{display:inline-block;transform:rotate(90deg);}
.details-arrow{display:inline-block;transition:transform .15s;}

/* SELECT */
select,.sel{font-family:inherit;font-size:13px;border:1px solid var(--border);border-radius:12px;padding:9px 10px;background:var(--surf2);color:var(--text);width:100%;-webkit-appearance:none;}
label.field-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin:12px 0 4px;}

/* LOCK */
.lock-screen{margin:40px 0;text-align:center;padding:0 8px;}
.lock-screen .lock-icon{font-size:48px;margin-bottom:14px;}
.lock-screen h3{font-size:20px;font-weight:800;margin:0 0 6px;}
.lock-screen p{color:var(--muted);font-size:13px;margin:0 0 20px;}
.lock-screen input{width:100%;font-family:inherit;font-size:15px;font-weight:600;background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:13px;color:var(--text);text-align:center;letter-spacing:.2em;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.lock-screen input::placeholder{color:var(--muted);letter-spacing:.02em;font-weight:400;font-size:13px;}
#loginError{color:var(--bad);font-size:12px;margin-top:4px;}

/* TOAST */
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--muted);font-size:14px;}

/* LOGIN SPLASH */
.login-splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 40px;background:var(--bg);position:relative;overflow:hidden;}
.splash-blob{position:absolute;top:-80px;right:-60px;width:260px;height:260px;border-radius:50%;background:var(--accent);opacity:.09;pointer-events:none;filter:blur(4px);}
.splash-blob2{position:absolute;bottom:-60px;left:-40px;width:200px;height:200px;border-radius:50%;background:var(--ok);opacity:.07;pointer-events:none;filter:blur(4px);}
.login-splash .brand{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.login-splash h1{font-size:28px;font-weight:800;margin:0 0 4px;color:var(--text);}
.login-splash .tagline{color:var(--muted);font-size:13px;margin:0 0 32px;text-align:center;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:340px;margin-bottom:12px;}
.role-card{background:var(--surf);border-radius:18px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow-sm);-webkit-tap-highlight-color:transparent;}
.role-card:active{transform:scale(.97);}
.role-card .rc-icon-wrap{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--sel-color,var(--accent)) 14%, var(--surf2));font-size:22px;transition:background .15s;}
.role-card .rc-label{font-size:12px;font-weight:600;text-align:center;}
.role-card.selected{box-shadow:0 0 0 2px var(--sel-color,var(--accent)), var(--shadow-sm);}
.role-card.selected .rc-icon-wrap{background:color-mix(in srgb, var(--sel-color,var(--accent)) 22%, var(--surf2));}
.viewer-btn{width:100%;max-width:340px;padding:13px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;}
.login-pass-box{width:100%;max-width:340px;background:var(--surf);border-radius:18px;padding:20px 18px;margin-bottom:14px;animation:slideUp .18s ease;box-shadow:var(--shadow);}
@keyframes slideUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.login-pass-box .lp-title{font-size:14px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.login-pass-box input{width:100%;font-family:inherit;font-size:15px;font-weight:600;background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text);text-align:center;letter-spacing:.2em;margin-bottom:10px;}
.login-pass-box input::placeholder{color:var(--muted);letter-spacing:.02em;font-weight:400;font-size:13px;}
.login-pass-box .lp-err{color:var(--bad);font-size:12px;margin-bottom:8px;min-height:18px;}
.login-pass-box .lp-submit{width:100%;padding:13px;border-radius:12px;border:none;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:opacity .15s;}

</style>
</head>

<script>

function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthStr(dateStr){ return dateStr.slice(0,7); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function showToast(msg){

const API_URL = 'https://script.google.com/macros/s/AKfycbw79Fcxf8BPieKv0_YvZwx5ZwPUaiGb9lSk5zjiH80mJhiKIeBdlw7_3Kp85hrcML11/exec';
const API_TOKEN = 'Lop10b1@2026';
// ====================================

const _cache = {};
async function sget(key){
  if(key in _cache) return _cache[key];
  try{
    const url = `${API_URL}?action=get&key=${encodeURIComponent(key)}&token=${encodeURIComponent(API_TOKEN)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const val = data.value ? JSON.parse(data.value) : null;
    _cache[key] = val;
    return val;
  } catch(e){ console.error('sget failed', key, e); return null; }
}
async function sgetMany(keys){
  // Lọc ra các key chưa có trong cache
  const missing = keys.filter(k => !(k in _cache));
  if(missing.length > 0){
    try{
      const url = `${API_URL}?action=getMany&keys=${encodeURIComponent(JSON.stringify(missing))}&token=${encodeURIComponent(API_TOKEN)}`;
      const res = await fetch(url);
      const data = await res.json();
      if(data.values){
        Object.entries(data.values).forEach(([k,v])=>{
          _cache[k] = v ? JSON.parse(v) : null;
        });
      }
    } catch(e){ console.error('sgetMany failed', e); }
  }
  // Trả về object {key: value} cho tất cả keys được yêu cầu
  const result = {};
  keys.forEach(k => { result[k] = k in _cache ? _cache[k] : null; });
  return result;
}
async function sset(key, value){
  _cache[key] = value; // cập nhật cache ngay, không chờ GAS
  try{
    const url = `${API_URL}?action=set&key=${encodeURIComponent(key)}&value=${encodeURIComponent(JSON.stringify(value))}&token=${encodeURIComponent(API_TOKEN)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return true;
  } catch(e){ console.error('sset failed', key, e); showToast('Lỗi lưu dữ liệu'); return false; }
}
async function doLogin(role, passcode){
  try{
    const url = `${API_URL}?action=login&role=${encodeURIComponent(role)}&passcode=${encodeURIComponent(passcode)}&token=${encodeURIComponent(API_TOKEN)}`;
    const res = await fetch(url);
    const data = await res.json();
    return !!data.ok;
  } catch(e){ return false; }
}

async function renderPublic(){

  const study = studyRaw || {status:{}};
  const duty = dutyRaw || null;
  const log = Array.isArray(discLog) ? discLog : [];

  // Điểm danh
  const present=[], late=[], absent=[];
  state.roster.forEach(s=>{
    const st = att.status[s.id]||'present';
    if(st==='present') present.push(s.name);
    else if(st==='late') late.push(s.name);
    else absent.push(s.name);

  const attHtml = `

  // Học tập

  return `<main>

    <h2 class="section">Học tập đầu giờ</h2>

async function computeWeekly(){
  const dates = [];
  const d = new Date(state.date+'T00:00:00');
  for(let i=0;i<7;i++){ const dd=new Date(d); dd.setDate(d.getDate()-i); dates.push(dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0')); }
  const result = {};
  const recs = await Promise.all(dates.map(dt=> sget('study:'+dt)));
  recs.forEach(rec=>{
    if(!rec) return;
    for(const [sid, st] of Object.entries(rec.status||{})){
      if(!result[sid]) result[sid] = {partial:0, none:0, noequip:0};
      if(st==='partial') result[sid].partial++;
      if(st==='none') result[sid].none++;
      if(st==='noequip') result[sid].noequip++;
    }
  });
  return result;
}

function computeAssigned(dateStr){
  if(!ldConfig || ldConfig.order.length===0) return [];
  const start = new Date(ldConfig.startDate+'T00:00:00');
  const cur = new Date(dateStr+'T00:00:00');
  const dayIndex = Math.floor((cur-start)/86400000);
  const n = ldConfig.order.length;
  const size = Math.max(1, parseInt(ldConfig.groupSize)||1);
  const groups = Math.ceil(n/size);
  if(dayIndex < 0 || groups===0) return ldConfig.order.slice(0,size);
  const g = ((dayIndex % groups)+groups) % groups;
  return ldConfig.order.slice(g*size, g*size+size);
}

function monthOf(dateStr){ return dateStr.slice(0,7); }
function prevMonths(month, n){
  const [y,m] = month.split('-').map(Number);
  const arr=[];
  for(let i=0;i<n;i++){ let mm=m-i, yy=y; while(mm<=0){mm+=12; yy-=1;} arr.push(yy+'-'+String(mm).padStart(2,'0')); }
  return arr;
}
async function getMonthLog(month){ return await sget('discipline:log:'+month) || []; }
function aggregateLog(log){
  const agg = {};
  log.forEach(e=>{
    if(!agg[e.studentId]) agg[e.studentId] = {cong:0, gay:0};
    if(e.type==='cong') agg[e.studentId].cong += e.value; else agg[e.studentId].gay += e.value;
  });
  return agg;
}
function gayTier(total){
  if(total>=3) return {label:'Báo phụ huynh · cân nhắc hạnh kiểm'};
  if(total===2) return {label:'Viết kiểm điểm + phạt trực nhật 3 ngày'};
  if(total===1) return {label:'Khiển trách'};
  return null;
}
function quyenLoiTier(total){
  const badges=[];
  if(total>50) badges.push('Đổi chỗ ngồi theo ý muốn');
  if(total>=40) badges.push('Quà to + tuyên dương');
  else if(total>=20) badges.push('Quà nhỏ + tuyên dương');
  return badges;
}

  }).join('');

  const assignSafe = assign || {};
  const assignRows = ASSIGNMENT_FIELDS.map(f=>`<div class="row"><span class="name">${f.title}</span><span class="week-sub">${escapeHtml(assignSafe[f.key]||'(chưa có)')}</span></div>`).join('');

  return `<main>
    <h2 class="section">Điểm danh ${formatDateVN(state.date)}</h2>
    <div class="card">
      <div class="week-sub">🚫 Vắng: ${absentList.join(', ')||'không có'}</div>
      <div class="week-sub">⏰ Muộn: ${lateList.join(', ')||'không có'}</div>
      <div class="week-sub">📱 Thu ĐT: ${att.phoneCount}/${state.roster.length} · Hòm: ${att.openedBox?'đã mở':'chưa mở'} / ${att.closedBox?'đã dọn':'chưa dọn'}</div>
    </div>
    <h2 class="section">Truy bài hôm nay</h2>
    <div class="card">
      ${issueList.length ? issueList.map(x=>`<div class="week-sub">${escapeHtml(x.name)} — ${x.st==='partial'?'thiếu bài':x.st==='none'?'không làm bài':'thiếu dụng cụ'}</div>`).join('') : '<p class="empty">Không có vấn đề gì hôm nay ✓</p>'}
      <div class="week-sub" style="margin-top:6px;">Đã nhắc BTVN: ${study.remind?'✓':'chưa'}</div>
    </div>
    <h2 class="section">Trực nhật hôm nay</h2>
    <div class="card">
      <div class="week-sub">${dutyNames.join(', ')||'chưa phân công'}</div>
      <div class="week-sub">Kiểm tra: ${duty && duty.checked==='pass'?'✓ Đạt':duty && duty.checked==='fail'?'✗ Chưa đạt':'chưa kiểm tra'}${duty && duty.note?(' — '+escapeHtml(duty.note)):''}</div>
    </div>
    <h2 class="section">Nền nếp tháng <input type="month" id="monthInput" value="${state.month}"></h2>
    ${disciplineRows}
    <h2 class="section">Phân công nhiệm vụ</h2>
    <div class="card">${assignRows}</div>
  </main>`;
}

async function submitTicksHandler(){
  const entries = [];
  Object.entries(disciplineTicks).forEach(([sid, ticks])=>{
    ticks.forEach(t=>{
      entries.push({id:uid(), studentId:sid, type:t.type, category:t.category, value:t.value, note:'', date:state.date});
    });
  });
  if(!entries.length) return;
  const entryMonth = monthOf(state.date);
  const log = await getMonthLog(entryMonth);
  const newLog = [...log, ...entries];
  await sset('discipline:log:'+entryMonth, newLog);
  disciplineTicks = {};
  showToast(`✓ Đã ghi nhận ${entries.length} mục cho ${formatDateVN(state.date)}`);
  renderAsync();
}

function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-tab]').forEach(btn=>{ btn.onclick = ()=>{ state.tab = btn.dataset.tab; render(); }; });
  const goLoginBtn = app.querySelector('[data-act="go-login"]');
  if(goLoginBtn) goLoginBtn.onclick = ()=>{ state.showLogin = true; state.isViewer = false; state.loginSelectedRole = null; render(); };
  app.querySelectorAll('[data-subtab]').forEach(btn=>{
    btn.onclick = ()=>{
      const [group,key] = btn.dataset.subtab.split(':');
      state.sub[group] = key;
      if(group==='kyluat'){ disciplineForm = {type:'cong', studentId:'', category:''}; }
      renderAsync();
    };
  });
  const dateInput = document.getElementById('dateInput');
  if(dateInput) dateInput.onchange = ()=>{ state.date = dateInput.value; disciplineTicks = {}; renderAsync(); };
  const todayBtn = app.querySelector('[data-act="today"]');
  if(todayBtn) todayBtn.onclick = ()=>{ state.date = todayStr(); renderAsync(); };
  // (no theme toggle)
  const monthInput = document.getElementById('monthInput');
  if(monthInput) monthInput.onchange = ()=>{ state.month = monthInput.value; renderAsync(); };

  const loginBtn = app.querySelector('[data-act="do-login"]');
  if(loginBtn) loginBtn.onclick = async ()=>{
    const val = document.getElementById('passcodeInput').value;
    const role = loginBtn.dataset.role;
    const ok = await doLogin(role, val);
    if(ok){ state.unlocked[role] = true; renderAsync(); }
    else { document.getElementById('loginError').textContent = 'Sai mật khẩu, thử lại.'; }
  };

  const addStudentBtn = app.querySelector('[data-act="add-student"]');
  if(addStudentBtn) addStudentBtn.onclick = ()=>{
    state.roster.push({id:uid(), name:'', to:null});
    render();
    const inputs = app.querySelectorAll('.rname');
    if(inputs.length) inputs[inputs.length-1].focus();
  };
  app.querySelectorAll('[data-act="rm-student"]').forEach(btn=>{ btn.onclick = ()=>{ state.roster = state.roster.filter(s=>s.id!==btn.dataset.id); render(); }; });
  app.querySelectorAll('.rname').forEach((inp,i)=>{ inp.oninput = ()=>{ state.roster[i].name = inp.value; }; });
  app.querySelectorAll('.select-to').forEach(sel=>{
    sel.onchange = ()=>{ const s = state.roster.find(x=>x.id===sel.dataset.id); if(s) s.to = sel.value ? parseInt(sel.value) : null; };
  });
  const saveRosterBtn = app.querySelector('[data-act="save-roster"]');
  if(saveRosterBtn) saveRosterBtn.onclick = async ()=>{
    state.roster = state.roster.filter(s=>s.name.trim()!=='');
    await saveRoster();
    showToast('✓ Đã lưu danh sách lớp');
    render();
  };
  const saveAssignBtn = app.querySelector('[data-act="save-assignments"]');
  if(saveAssignBtn) saveAssignBtn.onclick = async ()=>{
    const obj = {};
    app.querySelectorAll('.assign-input').forEach(inp=>{ obj[inp.dataset.key] = inp.value; });
    await sset('assignments', obj);
    showToast('✓ Đã lưu phân công');
  };

  app.querySelectorAll('[data-group="att"]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{ ltData.status[seg.dataset.id] = btn.dataset.val; renderAsync(); sset('attendance:'+state.date, ltData); };
    });
  });
  const phoneInc = app.querySelector('[data-act="phone-inc"]');
  const phoneDec = app.querySelector('[data-act="phone-dec"]');
  if(phoneInc) phoneInc.onclick = ()=>{ ltData.phoneCount = Math.min(state.roster.length, (ltData.phoneCount||0)+1); renderAsync(); sset('attendance:'+state.date, ltData); };
  if(phoneDec) phoneDec.onclick = ()=>{ ltData.phoneCount = Math.max(0, (ltData.phoneCount||0)-1); renderAsync(); sset('attendance:'+state.date, ltData); };
  const chkOpen = app.querySelector('[data-act="chk-open"]');
  if(chkOpen) chkOpen.onchange = ()=>{ ltData.openedBox = chkOpen.checked; sset('attendance:'+state.date, ltData); };
  const chkClose = app.querySelector('[data-act="chk-close"]');
  if(chkClose) chkClose.onchange = ()=>{ ltData.closedBox = chkClose.checked; sset('attendance:'+state.date, ltData); };

  app.querySelectorAll('[data-group="study"]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{ htData.status[seg.dataset.id] = btn.dataset.val; renderAsync(); sset('study:'+state.date, htData); };
    });
  });
  const chkRemind = app.querySelector('[data-act="chk-remind"]');
  if(chkRemind) chkRemind.onchange = ()=>{ htData.remind = chkRemind.checked; sset('study:'+state.date, htData); };

  app.querySelectorAll('[data-act="toggle-duty"]').forEach(chk=>{
    chk.onchange = ()=>{
      const id = chk.dataset.id;
      const idx = ldDayData.assigned.indexOf(id);
      if(idx>=0) ldDayData.assigned.splice(idx,1); else ldDayData.assigned.push(id);
      sset('duty:'+state.date, ldDayData);
    };
  });
  app.querySelectorAll('[data-group="duty-check"] button').forEach(btn=>{
    btn.onclick = ()=>{ ldDayData.checked = btn.dataset.val; renderAsync(); sset('duty:'+state.date, ldDayData); };
  });
  const saveDutyNoteBtn = app.querySelector('[data-act="save-duty-note"]');
  if(saveDutyNoteBtn) saveDutyNoteBtn.onclick = async ()=>{
    ldDayData.note = document.getElementById('dutyNote').value;
    await sset('duty:'+state.date, ldDayData);
    showToast('✓ Đã lưu nhận xét trực nhật');
  };
  // Upcoming duty — save per-day overrides
  app.querySelectorAll('.save-upcoming-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const ds = btn.dataset.date;
      const sel = app.querySelector(`.upcoming-duty-sel[data-date="${ds}"]`);
      const chosen = sel && sel.value ? [sel.value] : [];
      const existing = await sget('duty:'+ds) || {};
      await sset('duty:'+ds, {...existing, assigned: chosen});
      btn.textContent = '✓'; btn.style.background = 'var(--ok)';
      setTimeout(()=>{ btn.textContent = 'Lưu'; btn.style.background = 'var(--warn)'; }, 1200);
      // Invalidate today's cache if date matches
      if(ds === state.date) ldLoadedDate = null;
    };
  });
  const saveDutyConfigBtn = app.querySelector('[data-act="save-duty-config"]');
  if(saveDutyConfigBtn) saveDutyConfigBtn.onclick = async ()=>{
    ldConfig.groupSize = Math.max(1, parseInt(document.getElementById('groupSizeInput').value)||1);
    ldConfig.startDate = document.getElementById('startDateInput').value || state.date;
    await sset('duty:config', ldConfig);
    showToast('✓ Đã lưu cài đặt');
    renderAsync();
  };

  // --- Category chip click → set activeTickCat → re-render ---
  app.querySelectorAll('[data-cat-type]').forEach(btn=>{
    btn.onclick = ()=>{
      const type = btn.dataset.catType;
      const cat = btn.dataset.catLabel;
      const val = parseInt(btn.dataset.catVal);
      if(activeTickCat && activeTickCat.type===type && activeTickCat.category===cat){
        activeTickCat = null; // toggle off
      } else {
        activeTickCat = {type, category:cat, value:val};
      }
      renderAsync();
    };
  });
  // --- Student checkbox → update disciplineTicks ---
  app.querySelectorAll('.tick-stu-cb').forEach(cb=>{
    cb.onchange = ()=>{
      const sid = cb.dataset.sid;
      const ac = activeTickCat;
      if(!ac) return;
      if(!disciplineTicks[sid]) disciplineTicks[sid] = [];
      const idx = disciplineTicks[sid].findIndex(t=>t.type===ac.type && t.category===ac.category);
      if(cb.checked && idx<0){
        disciplineTicks[sid].push({type:ac.type, category:ac.category, value:ac.value});
      } else if(!cb.checked && idx>=0){
        disciplineTicks[sid].splice(idx,1);
        if(disciplineTicks[sid].length===0) delete disciplineTicks[sid];
      }
      renderAsync();
    };
  });
  // --- Submit ticks ---
  const existingSubBtn = app.querySelector('[data-act="submit-ticks"]');
  if(existingSubBtn) existingSubBtn.onclick = submitTicksHandler;

  app.querySelectorAll('[data-act="edit-disc"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.discId;
      const month = btn.dataset.discMonth;
      const oldVal = btn.dataset.discValue;
      const type = btn.dataset.discType;
      const unit = type === 'cong' ? 'điểm cộng' : 'gậy';
      const newVal = prompt(`Sửa số ${unit} (hiện tại: ${oldVal}):`, oldVal);
      if(newVal === null) return;
      const parsed = parseInt(newVal);
      if(isNaN(parsed) || parsed <= 0){ showToast('Số không hợp lệ'); return; }
      const log = await getMonthLog(month);
      const entry = log.find(e=>e.id===id);
      if(entry){ entry.value = parsed; }
      await sset('discipline:log:'+month, log);
      showToast('✓ Đã sửa');
      renderAsync();
    };
  });

  app.querySelectorAll('[data-act="del-disc"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.discId;
      const month = btn.dataset.discMonth;
      if(!confirm('Xoá ghi nhận này?')) return;
      const log = await getMonthLog(month);
      const updated = log.filter(e=>e.id !== id);
      await sset('discipline:log:'+month, updated);
      showToast('✓ Đã xoá');
      renderAsync();
    };
  });
}

init();
</script>
</body>
</html>
